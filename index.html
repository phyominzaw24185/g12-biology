ne","Estrogen","Insulin","Calcitonin"],0],["The activity of ___ is supported by another type of cells called glial cells.",["neurones","neurons","nephrons","axon"],0],["___ stimulates ripening of fruits.",["Abscisic acid","Cytokinin","Gibberellin","Ethylene"],3],["___ hormone promotes sperm formation.",["Estrogen","Oxytocin","Testosterone","Progesterone"],2],["Coconut milk is a rich source of ___.",["auxin","ethylene","gibberellin","cytokinin"],3],["The central nervous system is composed of the brain and ___.",["spinal nerves","cranial nerves","spinal cord","pons"],2],["The middle coat of the eyeball is called ___.",["iris","retina","cornea","choroid"],3],["A plant hormone is an ___ compound.",["organic","inorganic","nitrogen","ammonia"],0],["Multipolar neurone found in the ___ and spinal cord.",["brain","muscles","arteries","veins"],0],["Gibberellins are plant hormones that include ___.",["indole acetic acid","abscisic acid","adenine","gibberellic acid"],3],["The activity of neurones is supported by another type of cells called ___.",["glial cells","axon","dendron","myelin sheath"],0],["The nervous system is composed of only ___ main types of cells.",["one","two","four","five"],1],["Effect or requirements of relative length of day and night on flowering is called ___.",["photomorphogenesis","photoperiodism","vernalization","skotomorphogenesis"],1],["Inadequate production of ___ is linked to Alzheimer's disease.",["dopamine","serotonin","norepinephrine","endorphins"],0]],"m5":[{"q":"State the plant hormone gibberellin.","variants":["Write a note on Gibberellin hormone and its physiological effects."],"a":["Gibberellins are plant hormones that include gibberellic acid. They are produced in young organs such as apical leaves, developing buds, root tips and germinating seeds. Gibberellins transport usually by diffusion and may be transported in the xylem and phloem.","<b>Physiological effects of gibberellin</b><br>Some physiological effects of gibberellin in plants are as follows:<ol><li><b>Fruit growth:</b> Gibberellins promote growth of fruits.</li><li><b>Stem and leaf growth:</b> Gibberellins can stimulate stem elongation.</li><li><b>Seed germination:</b> Gibberellins promote seed germination. They stimulate the synthesis of hydrolytic enzymes like amylases, proteases, etc.</li></ol>"]},{"q":"Give an account on the importance of photomorphogenesis.","variants":[],"a":["<b>Importance of photomorphogenesis</b><br>Plant growth and development are influenced by a variety of environmental factors, including light. Light, on the other hand, causes a variety of responses in the plant body in addition to photosynthesis. These responses have a significant impact on the course of plant growth and the final plant appearance. They are morphogenic responses to light.","Many plant seeds, for example, do not germinate unless they are exposed to light. Seed germination in light demonstrates that seedlings require light to grow. Phototropic responses of seedlings and mature plant leaves are also photomorphogenic processes.","Older plants rely on photomorphogenesis responses as well. Many of these responses are in response to the relative lengths of day and night by forming reproductive structures or dormant buds that can withstand a cold winter (i.e., the phenomenon of photoperiodism and vernalization)."]},{"q":"Write short notes on photoperiodism.","variants":["Define photoperiodism and clarify categories of plants depending upon the duration of photoperiod.","Describe the photoperiodism in plants."],"a":["<b>Photoperiodism</b><br>Effect or requirements of relative length of day and night on flowering is called photoperiodism. Most plants flower only when they are subjected to a light phase for less or more than a critical period. A critical period is the period of light or darkness required by the plant to induce flowering. Depending upon the duration of photoperiod, plants have been divided into following categories:<ol><li><b>Short day plants</b><br>They require shorter photoperiod than their critical photoperiod in order to initiate flowering. They are long night plants. e.g., soybean, onion etc.</li><li><b>Long day plants</b><br>They require longer day light period than their critical photoperiod for flowering. They are short night plants. e.g., radish, potato etc.</li><li><b>Day neutral plants</b><br>They are indeterminate plants. The floral initiation in them is independent of photoperiodism. e.g., tomato, cotton etc.</li></ol>"]},{"q":"Enumerate the conditions for plant growth.","variants":["State the condition necessary for the growth of plants."],"a":["<b>Conditions for growth</b><br>The conditions required by a plant for growth are as follow:<ol><li><b>Light</b> is required for tissue differentiation, synthesis of photosynthetic pigments and photosynthesis.</li><li><b>Optimum temperature</b> for growth is 20-35 °C.</li><li><b>Water</b> maintains the turgidity of plants. It is essential for enzymatic activities in protoplasm and cell elongation.</li><li><b>Oxygen</b> is necessary for cellular respiration to produce metabolic energy.</li><li><b>Mineral nutrition</b> is raw material for synthesis of protoplasm as well as source of energy.</li><li><b>Growth regulators</b> are manufactured by living protoplasm.</li><li><b>Genetic factors</b> are involved in overall maintenance of a plant.</li></ol>"]},{"q":"Provide labels and caption to given diagram and state the spinal cord.","variants":[],"a":["<b>Labels:</b><ol><li>spinal cord</li><li>spinal nerve</li><li>vertebrae</li><li>intervertebral disc</li></ol>","<b>Caption:</b> The spinal cord","<b>Spinal cord</b><br>A cross section of the spinal cord, reveals both white matter and grey matter. The outer white matter consists of myelinated nerve fibres. The butterfly-shaped core is made up of grey matter, which contains unmyelinated neurones as well as the cell bodies and dendrites of many spinal neurones. The delicate tissues of the spinal cord are protected by cerebrospinal fluid, soft tissue layers, and the spinal column. The spinal column consists of a series of backbones (vertebrae). Injury to the spinal column can also damage the spinal cord, resulting in paralysis."]},{"q":"Write note on abscisic acid and its physiological effects.","variants":[],"a":["<b>Abscisic acid</b><br>Abscisic acid, also known as abscisin or dormin, is an example in the group of hormones that promote <b>dormancy</b> in plants. It is also known as stress hormone. It is produced naturally, when a plant is exposed to stress. The common stresses include lack of water, saline soils, cold temperature and frost.","<b>Physiological effects of abscisic acid</b><br>Some physiological effects of abscisic acid in plants are as follows:<ol><li>It causes abscission in leaves, flowers and fruits.</li><li>Abscisic acid includes synthesis of carotenoids. It is applied to green-orange colour to turn yellow.</li><li>Abscisic acid acts as antagonist of all growth promoters.</li></ol>"]},{"q":"Mention the three phases of plant growth depending upon the region.","variants":["Enumerate the phases of plant growth."],"a":["<b>Phases of growth</b><br>In plants, growth occurs in three phases depending upon the region of its occurrence:<ol><li><b>Meristematic phase</b> (Formative phase): It occurs in the meristematic regions, e.g., shoot apex and root apex. The cells in this phase can be easily differentiated from other cells. The cells of meristems are isodiametric, thin walled, and consist of large nucleus and dense cytoplasm.</li><li><b>Elongation phase</b> (Phase of cells enlargement): cells of this phase are found around the meristematic cells. These cells are highly vacuolated.</li><li><b>Maturation phase</b> (Phase of cell maturation and differentiation): Cells of this phase undergo structural and functional differentiation and thus, these cells develop into a specialized tissue.</li></ol>"]},{"q":"Write a note on gaseous phytohormone and its physiological effects.","variants":[],"a":["<b>Ethylene</b><br>Ethylene is the only gaseous phytohormone. It is produced naturally in plants from amino acid methionine. All parts of seed plants produce ethylene. Maximum synthesis of ethylene occurs during the ripening of fruits.","<b>Physiological effects of ethylene</b><br>Some physiological effects of ethylene in plants are as follows:<ol><li>Ethylene stimulates ripening of fruits. It also increases the rate of respiration. Due to this, ethylene is used in post-harvest technology i.e., for commercial ripening of fruits.</li><li>Ethylene causes drooping of leaves and flowers.</li><li>Ethylene induces rapid growth of internodes and leaf bases.</li></ol>"]},{"q":"State briefly on the somatic nervous system. (Illustration is not necessary.)","variants":["Write a note on somatic nervous system. (Illustration is not necessary)"],"a":["<b>The somatic nervous system</b><br>The somatic nervous system is under the voluntary control, and its neurones service to the head, trunk, and limbs. Its sensory neurones carry information from the receptors in the skin, tendons, and skeletal muscles. Its motor neurones carry information to the skeletal muscles.","The somatic system includes 12 pairs of cranial nerves and 31 pairs of spinal nerves, all of which are myelinated. The cranial nerves are largely associated with functions in the head, neck, and face. An exception is the vagus nerve, which has branches to the throat and larynx, but also connects to many internal organs, including the heart, lungs, bronchi, digestive tract, liver, and pancreas."]},{"q":"Enumerate the conditions required by a plant for growth.","variants":["Enumerate the conditions for plant growth."],"a":["<b>Conditions for growth</b><br>The conditions required by a plant for growth are as follow:<ol><li><b>Light</b> is required for tissue differentiation, synthesis of photosynthetic pigments and photosynthesis.</li><li><b>Optimum temperature</b> for growth is 20-35 °C.</li><li><b>Water</b> maintains the turgidity of plants. It is essential for enzymatic activities in protoplasm and cell elongation.</li><li><b>Oxygen</b> is necessary for cellular respiration to produce metabolic energy.</li><li><b>Mineral nutrition</b> is raw material for synthesis of protoplasm as well as source of energy.</li><li><b>Growth regulators</b> are manufactured by living protoplasm.</li><li><b>Genetic factors</b> are involved in overall maintenance of a plant.</li></ol>"]},{"q":"Provide labels and a caption to given diagram and describe the examples of reflexes. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>stimulus</li><li>pain receptor</li><li>receptor in skin</li><li>skin</li><li>sensory neurone</li><li>interneurone</li><li>spinal cord</li><li>motor neurone</li><li>effector (muscle)</li><li>response</li></ol>","<b>Caption:</b> The reflex arc","<b>Examples of reflexes are</b><ol><li>jerking the hand away from a hot or sharp object,</li><li>blinking when an object moves toward the eye, or</li><li>vomiting in response to food that irritates the stomach.</li></ol>"]},{"q":"Define the cytokinin and explain its physiological effects.","variants":[],"a":["<b>Cytokinin</b><br>Cytokinin is a basic hormone and purine (adenine) derivative. It primarily acts on cell division, but it also has important interactions with auxin in the growth and development of plants. Cytokinin occurs naturally in the regions with high cell division, e.g., root apices. Coconut milk is a rich source of cytokinins.","<b>Physiological effects of cytokinin</b><br>Some physiological effects of cytokinin in plants are as follows:<ol><li><b>Flowering:</b> Cytokinins induce flowering in plants.</li><li>Promote lateral bud developments in dicots.</li><li>Development of the chloroplast.</li></ol>"]},{"q":"Draw a labeled diagram of the front view of the left eye.","variants":["Draw a labelled diagram of front view of the left eye."],"a":["<b>Labels:</b><ol><li>tear sac empties into nasal cavity</li><li>remain of third eyelid (nictitating membrane)</li><li>lower eyelid</li><li>pupil</li><li>eye lashes</li><li>sclerotic coat (or sclera) covered by conjunctiva</li><li>tear gland</li><li>upper eyelid</li><li>iris</li><li>tear ducts</li></ol>","<b>Caption:</b> The front view of the left eye"]},{"q":"List the two groups of plant growth regulators and describe the auxin.","variants":[],"a":["<b>Types of plant growth regulators</b><br>They can be placed under two groups based on their function:<ol><li><b>Growth promoters</b>, e.g., auxin, gibberellin and cytokinin</li><li><b>Growth inhibitors</b>, e.g., ethylene and abscisic acid can induce dormancy and abscission.</li></ol>","<b>Auxin</b><br>Auxins are weak organic acids produced naturally by plants. It is the first plant growth regulator. Chemically this hormone is <b>indole acetic acid</b> (IAA). Actively growing regions of a plant usually produce the largest amounts of auxins. The regions rich in auxins are the meristems, including shoot tips, root tips, cambia and also young leaves, developing flowers and fruits."]}],"m10":[{"q":"Tabulate the differences between nervous system and endocrine system.","variants":["Tabulate the differences between nervous and endocrine systems.","Comparison between nervous system and endocrine systems with relevant table."],"a":["<b>Differences between nervous and endocrine systems</b><table class='tb'><tr><th>Feature</th><th>Nervous system</th><th>Endocrine system</th></tr><tr><td>Transmission of information</td><td><ul><li>information is transmitted as a nerve impulse (electrical in nature along a neurone)</li><li>it is transmitted as chemical substance (neurotransmitters) between neurones or a neurone and muscle cells (synaptic cleft)</li></ul></td><td><ul><li>information is transmitted as a chemical substance (hormone)</li></ul></td></tr><tr><td>Mode of transmission</td><td>by nerve cells (neurones)</td><td>by bloodstream</td></tr><tr><td>Speed of transmission</td><td>fast</td><td><ul><li>slow</li><li>it is determined by the speed of blood flows through the blood vessels</li></ul></td></tr><tr><td>Duration of effect</td><td>short-lived, within milliseconds</td><td>usually longer lasting, from minutes to days</td></tr><tr><td>Localization of effect</td><td>may affect only a localized region of the body</td><td>may affect one or more organs in different parts of the body (e.g., removal of hand from a painful situation, it effect is only the muscle in hand that responsible for it)</td></tr></table>"]},{"q":"Provide labels and a caption to given diagram and describe the any five different parts of the eye.","variants":[],"a":["<b>Labels:</b><ol><li>tear sac empties into nasal cavity</li><li>remain of third eyelid (nictitating membrane)</li><li>lower eyelid</li><li>pupil</li><li>eye lashes</li><li>sclerotic coat (or sclera) covered by conjunctiva</li><li>tear gland</li><li>upper eyelid</li><li>iris</li><li>tear ducts</li></ol>","<b>Caption:</b> The front view of the left eye","<table class='tb'><tr><th>Parts</th><th>Description</th><th>Function</th></tr><tr><td>Sclera</td><td><ul><li>outermost coat of the eyeball</li><li>tough, fibrous and opaque</li></ul></td><td><ul><li>protects the eye from physical injuries</li><li>maintains the shape of the eyeball</li></ul></td></tr><tr><td>Conjunctiva</td><td>a transparent membrane that covers the exposed part of the eyeball</td><td>protects the cornea</td></tr><tr><td>Ciliary body</td><td>a thickened region at the front end of the choroid</td><td>changes the thickness of the lens during accommodation</td></tr><tr><td>Pupil</td><td>a round opening in the iris</td><td>allows light to enter</td></tr><tr><td>Optic nerve</td><td>a nerve in the eyeball</td><td>transmits nerve impulses from the retina to the brain</td></tr></table>"]},{"q":"Provide labels and caption to given diagram and tabulate sclera, cornea, conjunctiva, choroid and ciliary body in the different parts of the eye.","variants":[],"a":["<b>Labels:</b><ol><li>tear sac empties into nasal cavity</li><li>remain of third eyelid (nictitating membrane)</li><li>lower eyelid</li><li>pupil</li><li>eye lashes</li><li>sclerotic coat (or sclera) covered by conjunctiva</li><li>tear gland</li><li>upper eyelid</li><li>iris</li><li>tear ducts</li></ol>","<b>Caption:</b> The front view of the left eye","<table class='tb'><tr><th>Parts</th><th>Description</th><th>Function</th></tr><tr><td>Sclera</td><td><ul><li>outermost coat of the eyeball</li><li>tough, fibrous and opaque</li></ul></td><td><ul><li>protects the eye from physical injuries</li><li>maintains the shape of the eyeball</li></ul></td></tr><tr><td>Cornea</td><td><ul><li>a transparent layer continuous with the sclera</li><li>light enters the eye through the cornea</li></ul></td><td>refracts the light rays that enter the eye</td></tr><tr><td>Conjunctiva</td><td>a transparent membrane that covers the exposed part of the eyeball</td><td>protects the cornea</td></tr><tr><td>Choroid</td><td><ul><li>the middle coat of the eyeball</li><li>contains a black pigment and has a network of blood capillaries</li></ul></td><td><ul><li>black pigment absorbs light and prevents internal reflection of light</li><li>blood vessels supply oxygen and nutrients to the cells of the retina</li></ul></td></tr><tr><td>Ciliary body</td><td>a thickened region at the front end of the choroid</td><td>changes the thickness of the lens during accommodation</td></tr></table>"]},{"q":"Mention the physiological effects of auxin, cytokinin and ethylene.","variants":[],"a":["<b>Physiological effects of auxin</b><br>Some physiological effects of auxin in plants are as follows:<ol><li><b>Root inhibition:</b> Auxin inhibits the elongation of primary roots. However, it can stimulate the initiation of lateral and adventitious roots.</li><li><b>Parthenocarpy:</b> Application of auxin to unpollinated pistil makes them develop seedless fruits or parthenocarpy.</li><li><b>Cell elongation:</b> It stimulates the elongation of cells in the shoot and promotes cell enlargement.</li><li><b>Abscission:</b> In younger parts, auxin delays abscission. On the other hand, in mature parts, it stimulates abscission.</li><li><b>Cell division:</b> Auxin initiates and promotes cell division in vascular cambium.</li></ol>","<b>Physiological effects of cytokinin</b><br>Some physiological effects of cytokinin in plants are as follows:<ol><li><b>Flowering:</b> Cytokinins induce flowering in plants.</li><li>Promote lateral bud developments in dicots.</li><li>Development of the chloroplast.</li></ol>","<b>Physiological effects of ethylene</b><br>Some physiological effects of ethylene in plants are as follows:<ol><li>Ethylene stimulates ripening of fruits. It also increases the rate of respiration. Due to this, ethylene is used in post-harvest technology i.e., for commercial ripening of fruits.</li><li>Ethylene causes drooping of leaves and flowers.</li><li>Ethylene induces rapid growth of internodes and leaf bases.</li></ol>"]},{"q":"Draw a labelled diagram to the structure of a typical neurone and state the dendrites and axon in neurones.","variants":["Draw a labelled diagram to the structure of a typical neurone and explain the dendrites and axon."],"a":["<b>Labels:</b><ol><li>nucleus</li><li>dendrite</li><li>dendron</li><li>ends that link with adjacent nerve cells</li><li>long axon</li><li>myelin sheath (insulator)</li><li>cell body</li><li>direction of nerve impulse</li></ol>","<b>Caption:</b> Structure of a typical neurone","<b>Dendrites</b><br><b>Dendrites</b> are short, branching terminals of <b>dendron</b> that receive nerve impulses from other neurones or sensory receptors, and relay the impulse to the cell body. The dendrites are numerous and highly branched, which increases the surface area available to receive information.","<b>Axon</b><br>The <b>axon</b> conducts impulses away from the cell body. Axons range in length from 1 mm to 1 m, depending on the neurone's location in the body. The terminal end of an axon branches into many fibres to communicate with adjacent neurones, glands, or muscles. The axon terminal releases chemical signals into the space between it and the receptors or dendrites of neighbouring cells."]},{"q":"Tabulate the effect of abnormal production and function of neurotransmitters.","variants":[],"a":["<b>List of some common neurotransmitters and their functions</b><table class='tb'><tr><th>Neurotransmitters</th><th>Function</th><th>Effects of abnormal production</th></tr><tr><td>Dopamine</td><td><ul><li>affects the brain synapses in the control of body movements</li><li>is linked to sensations of pleasure, such as eating</li></ul></td><td><ul><li>excessive production linked to schizophrenia, a disorder in which the individual's perception of reality is greatly distorted</li><li>inadequate production linked to Alzheimer's disease, Parkinson's disease, a progressive disorder that destroys neurones, causing tremors, slurred speech, and coordination problems</li></ul></td></tr><tr><td>Serotonin</td><td><ul><li>regulates temperature and sensory perception</li><li>is involved in mood control</li></ul></td><td><ul><li>inadequate amounts in the brain synapses linked to depression</li></ul></td></tr><tr><td>Endorphins</td><td><ul><li>act as natural painkillers in synapses in the brain</li><li>also affect emotional areas of the brain</li></ul></td><td><ul><li>deficiency linked to an increased risk of alcoholism</li></ul></td></tr><tr><td>Norepinephrine</td><td><ul><li>used by the brain and some autonomic neurones</li><li>complements the actions of the hormone epinephrine, which readies the body to respond to danger or other stressful situations</li></ul></td><td><ul><li>overproduction linked to high blood pressure, anxiety, and insomnia</li><li>deficiency linked to hunger cravings and exhaustion</li></ul></td></tr></table>"]},{"q":"Provide labels and caption to given diagram and explain dendrites and axons in neurone.","variants":[],"a":["<b>Labels:</b><ol><li>nucleus</li><li>dendrite</li><li>dendron</li><li>ends that link with adjacent nerve cells</li><li>long axon</li><li>myelin sheath (insulator)</li><li>cell body</li><li>direction of nerve impulse</li></ol>","<b>Caption:</b> Structure of a typical neurone","<b>Dendrites</b><br><b>Dendrites</b> are short, branching terminals of <b>dendron</b> that receive nerve impulses from other neurones or sensory receptors, and relay the impulse to the cell body. The dendrites are numerous and highly branched, which increases the surface area available to receive information.","<b>Axon</b><br>The <b>axon</b> conducts impulses away from the cell body. Axons range in length from 1 mm to 1 m, depending on the neurone's location in the body. The terminal end of an axon branches into many fibres to communicate with adjacent neurones, glands, or muscles. The axon terminal releases chemical signals into the space between it and the receptors or dendrites of neighbouring cells."]},{"q":"Give labeled diagram of the front view of left eye and tabulate the function of cornea, iris and retina in different parts of the eye.","variants":[],"a":["<b>Labels:</b><ol><li>tear sac empties into nasal cavity</li><li>remain of third eyelid (nictitating membrane)</li><li>lower eyelid</li><li>pupil</li><li>eye lashes</li><li>sclerotic coat (or sclera) covered by conjunctiva</li><li>tear gland</li><li>upper eyelid</li><li>iris</li><li>tear ducts</li></ol>","<b>Caption:</b> The front view of the left eye","<table class='tb'><tr><th>Parts</th><th>Function</th></tr><tr><td>Cornea</td><td>refracts the light rays that enter the eye</td></tr><tr><td>Iris</td><td>changes the size of the pupil through the antagonistic action of the circular and radial muscles, thereby adjusting the amount of light that enters the eye</td></tr><tr><td>Retina</td><td><ul><li>acts as a screen for the formation of images</li><li>rod cells are sensitive under low light and responsible for vision at night</li><li>cone cells are responsible for colour vision under conditions of high light intensity</li></ul></td></tr></table>"]},{"q":"Give labeled diagram of the front view of the left eye and tabulate sclera, cornea, conjunctiva and choroid in the different parts of the eye.","variants":[],"a":["<b>Labels:</b><ol><li>tear sac empties into nasal cavity</li><li>remain of third eyelid (nictitating membrane)</li><li>lower eyelid</li><li>pupil</li><li>eye lashes</li><li>sclerotic coat (or sclera) covered by conjunctiva</li><li>tear gland</li><li>upper eyelid</li><li>iris</li><li>tear ducts</li></ol>","<b>Caption:</b> The front view of the left eye","<table class='tb'><tr><th>Parts</th><th>Description</th><th>Function</th></tr><tr><td>Sclera</td><td><ul><li>outermost coat of the eyeball</li><li>tough, fibrous and opaque</li></ul></td><td><ul><li>protects the eye from physical injuries</li><li>maintains the shape of the eyeball</li></ul></td></tr><tr><td>Cornea</td><td><ul><li>a transparent layer continuous with the sclera</li><li>light enters the eye through the cornea</li></ul></td><td>refracts the light rays that enter the eye</td></tr><tr><td>Conjunctiva</td><td>a transparent membrane that covers the exposed part of the eyeball</td><td>protects the cornea</td></tr><tr><td>Choroid</td><td><ul><li>the middle coat of the eyeball</li><li>contains a black pigment and has a network of blood capillaries</li></ul></td><td><ul><li>black pigment absorbs light and prevents internal reflection of light</li><li>blood vessels supply oxygen and nutrients to the cells of the retina</li></ul></td></tr></table>"]},{"q":"Explain the photomorphogenesis and its importance.","variants":["How do you understand the term photomorphogenesis? Explain the importance of photomorphogenesis."],"a":["<b>Photomorphogenesis</b><br>Plants can sense light direction, quality, intensity and periodicity. Light induces phototropism, photomorphogenesis, flowering, germination, etc. Plants exhibit different growth habits in dark and light. In the dark, they have elongated stems, undifferentiated chloroplasts and unexpanded leaves. This is called photomorphogenesis.","Photomorphogenesis involves inhibition of stem elongation, differentiation of chloroplast, accumulation of chlorophyll, and expansion of leaves. Photomorphogenesis can be induced by red, far-red and blue light. Light is perceived in plants by photoreceptor i.e., phytochrome, cryptochrome and phototropin. The photomorphogenesis stimulus is perceived in leaves by phytochrome. Phytochrome is a protein containing covalently attached chromosphore. It is a blue green pigment.","<b>Importance of photomorphogenesis</b><br>Plant growth and development are influenced by a variety of environmental factors, including light. Light, on the other hand, causes a variety of responses in the plant body in addition to photosynthesis. These responses have a significant impact on the course of plant growth and the final plant appearance. They are morphogenic responses to light.","Many plant seeds, for example, do not germinate unless they are exposed to light. Seed germination in light demonstrates that seedlings require light to grow. Phototropic responses of seedlings and mature plant leaves are also photomorphogenic processes.","Older plants rely on photomorphogenesis responses as well. Many of these responses are in response to the relative lengths of day and night by forming reproductive structures or dormant buds that can withstand a cold winter (i.e., the phenomenon of photoperiodism and vernalization)."]},{"q":"State the characteristics of plant growth regulators and explain auxin with its physiological effects.","variants":[],"a":["<b>Characteristics of plant growth regulators</b><ul><li>Phytohormones are essential organic compounds required in very small quantities.</li><li>These are generally synthesized at the apices of root, stem and in leaves.</li><li>A single hormone may regulate different aspects of growth.</li><li>Their synthesis is under genetic control and influenced by environmental factors.</li></ul>","<b>Auxin</b><br>Auxins are weak organic acids produced naturally by plants. It is the first plant growth regulator. Chemically this hormone is <b>indole acetic acid</b> (IAA). Actively growing regions of a plant usually produce the largest amounts of auxins. The regions rich in auxins are the meristems, including shoot tips, root tips, cambia and also young leaves, developing flowers and fruits.","<b>Physiological effects of auxin</b><br>Some physiological effects of auxin in plants are as follows:<ol><li><b>Root inhibition:</b> Auxin inhibits the elongation of primary roots. However, it can stimulate the initiation of lateral and adventitious roots.</li><li><b>Parthenocarpy:</b> Application of auxin to unpollinated pistil makes them develop seedless fruits or parthenocarpy.</li><li><b>Cell elongation:</b> It stimulates the elongation of cells in the shoot and promotes cell enlargement.</li><li><b>Abscission:</b> In younger parts, auxin delays abscission. On the other hand, in mature parts, it stimulates abscission.</li><li><b>Cell division:</b> Auxin initiates and promotes cell division in vascular cambium.</li></ol>"]},{"q":"Draw a labelled diagram to the vertical section of the eye and explain the roles of iris and pupil.","variants":[],"a":["<b>Labels:</b><ol><li>conjunctiva</li><li>suspensory ligament</li><li>iris</li><li>aqueous humour</li><li>pupil</li><li>cornea</li><li>lens</li><li>ciliary muscle</li><li>rectus muscle</li><li>sclera</li><li>choroid</li><li>retina</li><li>vitreous humour</li><li>yellow spot (fovea)</li><li>blind spot</li><li>optic nerve</li></ol>","<b>Caption:</b> The vertical section of the eye","<b>Iris</b><br>changes the size of the pupil through the antagonistic action of the circular and radial muscles, thereby adjusting the amount of light that enters the eye.","<b>Pupil</b><br>allows light to enter."]},{"q":"Illustrate the structure of a typical neurone and explain the specialized cell structures of neurone.","variants":[],"a":["<b>Labels:</b><ol><li>nucleus</li><li>dendrite</li><li>dendron</li><li>ends that link with adjacent nerve cells</li><li>long axon</li><li>myelin sheath (insulator)</li><li>cell body</li><li>direction of nerve impulse</li></ol>","<b>Caption:</b> Structure of a typical neurone","<b>Dendrites</b><br><b>Dendrites</b> are short, branching terminals of <b>dendron</b> that receive nerve impulses from other neurones or sensory receptors, and relay the impulse to the cell body. The dendrites are numerous and highly branched, which increases the surface area available to receive information.","<b>Axon</b><br>The <b>axon</b> conducts impulses away from the cell body. Axons range in length from 1 mm to 1 m, depending on the neurone's location in the body. The terminal end of an axon branches into many fibres to communicate with adjacent neurones, glands, or muscles. The axon terminal releases chemical signals into the space between it and the receptors or dendrites of neighbouring cells.","The axons of some neurones are enclosed in a fatty, insulating layer called the <b>myelin sheath</b>, which is made up of Schwann cells, a type of glial cell, by wrapping themselves around the axon. Functions of the myelin sheath are:<ol><li>to protect the nerve fibre or axon from injury,</li><li>to supply nutrients to axon,</li><li>to act as an insulator to the nerve impulses,</li><li>to increase the speed of transmission of the nerve impulses.</li></ol>"]},{"q":"Provide labels and a caption to given diagram and explain the nature of reflex arc. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>stimulus</li><li>pain receptor</li><li>receptor in skin</li><li>skin</li><li>sensory neurone</li><li>interneurone</li><li>spinal cord</li><li>motor neurone</li><li>effector (muscle)</li><li>response</li></ol>","<b>Caption:</b> The reflex arc","<b>The reflex arc</b><br>Some neurones are organized to enable the body to react rapidly in times of danger, even before consciously aware of the threat. These sudden, involuntary responses to certain stimuli are called reflexes. Examples of reflexes are (i) jerking the hand away from a hot or sharp object, (ii) blinking when an object moves toward the eye, or (iii) vomiting in response to food that irritates the stomach.","Reflex arcs are simple connections of only three neurones to transmit messages. As a result, reflexes can be very rapid, occurring in about 50 ms (milliseconds). For example, a typical neural circuit of withdrawal reflex from a potentially painful situation. Receptors in the skin sense the pressure of the cactus needle and initiate an impulse in a sensory neurone. The impulse carried by the sensory neurone then activates the interneurone in the spinal cord which then signals the motor neurone to instruct the muscle to contract and withdraw the hand. A reflex arc moves directly to and from the brain or spinal cord, before the brain centres involved with voluntary control have time to process the sensory information."]},{"q":"List the two groups of plant growth regulators and explain auxin with its physiological effects.","variants":[],"a":["<b>Types of plant growth regulators</b><br>They can be placed under two groups based on their function:<ol><li><b>Growth promoters</b>, e.g., auxin, gibberellin and cytokinin</li><li><b>Growth inhibitors</b>, e.g., ethylene and abscisic acid can induce dormancy and abscission.</li></ol>","<b>Auxin</b><br>Auxins are weak organic acids produced naturally by plants. It is the first plant growth regulator. Chemically this hormone is <b>indole acetic acid</b> (IAA). Actively growing regions of a plant usually produce the largest amounts of auxins. The regions rich in auxins are the meristems, including shoot tips, root tips, cambia and also young leaves, developing flowers and fruits.","<b>Physiological effects of auxin</b><br>Some physiological effects of auxin in plants are as follows:<ol><li><b>Root inhibition:</b> Auxin inhibits the elongation of primary roots. However, it can stimulate the initiation of lateral and adventitious roots.</li><li><b>Parthenocarpy:</b> Application of auxin to unpollinated pistil makes them develop seedless fruits or parthenocarpy.</li><li><b>Cell elongation:</b> It stimulates the elongation of cells in the shoot and promotes cell enlargement.</li><li><b>Abscission:</b> In younger parts, auxin delays abscission. On the other hand, in mature parts, it stimulates abscission.</li><li><b>Cell division:</b> Auxin initiates and promotes cell division in vascular cambium.</li></ol>"]},{"q":"Enumerate the phases and conditions for plant growth.","variants":[],"a":["<b>Phases of growth</b><br>In plants, growth occurs in three phases depending upon the region of its occurrence:<ol><li><b>Meristematic phase</b> (Formative phase): It occurs in the meristematic regions, e.g., shoot apex and root apex. The cells in this phase can be easily differentiated from other cells. The cells of meristems are isodiametric, thin walled, and consist of large nucleus and dense cytoplasm.</li><li><b>Elongation phase</b> (Phase of cells enlargement): cells of this phase are found around the meristematic cells. These cells are highly vacuolated.</li><li><b>Maturation phase</b> (Phase of cell maturation and differentiation): Cells of this phase undergo structural and functional differentiation and thus, these cells develop into a specialized tissue.</li></ol>","<b>Conditions for growth</b><br>The conditions required by a plant for growth are as follow:<ol><li><b>Light</b> is required for tissue differentiation, synthesis of photosynthetic pigments and photosynthesis.</li><li><b>Optimum temperature</b> for growth is 20-35 °C.</li><li><b>Water</b> maintains the turgidity of plants. It is essential for enzymatic activities in protoplasm and cell elongation.</li><li><b>Oxygen</b> is necessary for cellular respiration to produce metabolic energy.</li><li><b>Mineral nutrition</b> is raw material for synthesis of protoplasm as well as source of energy.</li><li><b>Growth regulators</b> are manufactured by living protoplasm.</li><li><b>Genetic factors</b> are involved in overall maintenance of a plant.</li></ol>"]}]};

 substances","essential mineral"],0],["Plant disease is caused by a ___ or an environmental factor.",["pest","insect","virus","pathogen"],3],["Female Anopheles mosquitoes feed on human blood to obtain the ___ they need to develop their eggs.",["nutrient","food","carbohydrate","protein"],3],["The study of plant diseases is called plant ___.",["pathology","taxonomy","physiology","anatomy"],0],["Infectious disease includes ___.",["diabetes","tuberculosis","hypertension","cardiovascular disease"],1],["Soft rot of fruits disease caused by ___.",["Aspergillus","Botrytis","Rhizopus","Fusarium"],2],["Quinine and chloroquine are used in the treatment of ___.",["tuberculosis","malaria","typhoid","pneumonia"],1],["Artesunate is a drug derived from the plant compound ___.",["aspirin","quinine","mefloquinine","artemisinin"],3],["___ are intracellular pathogenic particles that infect other living organisms.",["Bacteria","Viruses","Fungi","Nematodes"],1],["Most cases of ___ are caused by Plasmodium.",["malaria","typhoid","Alzheimer's","cancer"],0],["Example of non-infectious diseases include ___.",["cholera","covid","diabetes","tuberculosis"],2],["Signs of plant disease are ___ evidence of the pathogen.",["physical","chemical","geological","botanical"],0],["Sedentary lifestyle can lead to ___ diseases.",["diabetes","stroke","heart","kidney"],2],["Plant pathogens are very similar to those that cause ___ in humans and animals.",["pathogen","fungi","disease","symptom"],2],["The female Anopheles mosquito is therefore a vector of ___.",["malaria","cancer","typhoid","diarrhoea"],0],["Oxygen is supplied to the heart muscle by the ___.",["pulmonary arteries","pulmonary veins","coronary arteries","coronary veins"],2]],"m5":[{"q":"Explain how to prevent the cardiovascular disease.","variants":[],"a":["Eating a balanced diet with a variety of fats and plenty of fruit and vegetables helps prevent atherosclerosis. Not smoking and maintaining a healthy weight – a body mass index (BMI) of 18.5–25 kg/m² is the ideal range. It is needed to control high blood pressure and type 2 diabetes. Taking regular exercise strengthens the heart muscle and helps to control blood pressure and cholesterol level. It also reduces constant stress. Thus, all these factors contribute towards the prevention of cardiovascular disease."]},{"q":"Enumerate the reasons for the worldwide concern over the spread of malaria.","variants":["Give the reasons for the worldwide concern over the spread of malaria."],"a":["<b>The reasons for the worldwide concern over the spread of malaria are:</b><ul><li>an increase in drug-resistant forms of <i>Plasmodium</i>.</li><li>an increase in the proportion of cases caused by <i>P. falciparum</i>, the form that causes severe, often fatal malaria.</li><li>difficulties in developing vaccines against malaria.</li><li>an increase in the number of epidemics, because of climatic and environmental changes that favour the spread of mosquitoes.</li><li>the migration of people from areas where malaria is endemic, for economic and political reasons.</li></ul>"]},{"q":"State the non modifiable risk factors for cardiovascular disease.","variants":["Explain the three main non-modifiable risk factors for cardiovascular disease."],"a":["<b>Non-modifiable risk factors for cardiovascular disease</b><br>The three main risk factors for CVDs which cannot be changed are:<ul><li><b>Genes:</b> there is a genetic tendency (trend) in some families, and also in some ethnic groups, to develop CVDs. These trends can include (i) arteries which are easily damaged, (ii) a tendency to develop hypertension which can cause arterial damage and make CVDs more likely, and (iii) problems with the cholesterol balance of the body.</li><li><b>Age:</b> as a person gets older, the blood vessels begin to lose their elasticity and to narrow slightly. This can make more likely to suffer from CVDs, particularly heart disease.</li><li><b>Gender:</b> men are more likely to suffer from heart disease (and other CVDs) than women.</li></ul>"]},{"q":"Explain the groups of plant pathogenic bacteria. (Tabulation is not necessary)","variants":[],"a":["<b>Groups of plant pathogens – bacteria</b><br>Not all bacteria are bad for plants and soil. In fact, most are beneficial. However, there are approximately 200 types of bacteria that cause diseases in plants. They are most active in warm and humid environments. Bacteria that cause plant diseases are spread in many ways. They can be splashed about by rain or carried by the wind, birds or insects. Most plant pathogenic bacteria belong to the following genera: <i>Agrobacterium, Erwinia, Pseudomonas, Streptomyces</i> and <i>Xanthomonas</i>."]},{"q":"Explain biotic or infectious diseases for plants. (Illustration is not necessary)","variants":["Clarify the biotic or infectious diseases."],"a":["<b>Biotic or infectious diseases</b><br>Biotic diseases can spread throughout one plant and also may spread to neighbouring plants of the same species. These include biotic problems caused by living organisms such as pathogens, nematodes, insects and other arthropods. Biotic diseases sometimes show physical evidence (signs) of the pathogen, such as fungal growth, bacterial ooze, or nematode cysts, or the presence of mites or insects. Many plant problems, especially biotic problems, if not recognized and controlled early in their development, they can result in significant economic damage for the producer. Therefore, timely and accurate diagnoses are required so that appropriate pest and disease management options and other corrective measures can be implemented."]},{"q":"Describe the diet and obesity that modifiable risk factors for cardiovascular disease in human.","variants":[],"a":["<b>Diet and obesity</b><br>An increasing number of studies suggest that being overweight does not directly affect the risk of developing CVDs, but it is a very important indicator of risk. Most scientists think that the best predictors of future CVDs are: (i) where fat is stored on the body, (ii) how much exercise a person does and (iii) the levels of different fats in the blood.","Two other factors which are often a direct result of being overweight do increase the risk of atherosclerosis and CVDs. These are:<ul><li>high blood pressure which increases the risk of damage to blood vessel linings, and so of plaque formation</li><li>type 2 diabetes – this can result in damage to the lining of the blood vessels which increases the risk of plaque formation.</li></ul>","Many studies are starting to find that an increased risk of developing a disease is often due to a combination of factors."]},{"q":"Tabulate some diseases of plants caused by fungi.","variants":[],"a":["<b>Some diseases of plants caused by fungi</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Alternaria</i></td><td>Leaf spots and blight of various plants</td></tr><tr><td>2</td><td><i>Aspergillus</i></td><td>Rots of seeds</td></tr><tr><td>3</td><td><i>Botrytis</i></td><td>Blights of various plants</td></tr><tr><td>4</td><td><i>Fusarium</i></td><td>Root rot of many plants</td></tr><tr><td>5</td><td><i>Puccinia</i></td><td>Rust of cereals</td></tr><tr><td>6</td><td><i>Rhizopus</i></td><td>Soft rot of fruits</td></tr><tr><td>7</td><td><i>Sclerotinia</i></td><td>Soft rot of vegetables</td></tr></table>"]},{"q":"Explain the smoking and inactivity as modifiable risk factors for cardiovascular disease.","variants":[],"a":["<b>Smoking</b><br>Studies have shown that smokers are far more likely to develop atherosclerosis than non-smokers with a similar lifestyle. Studies found that the substances in tobacco smoke: (i) can damage the artery linings, which makes the build-up of plaques more likely, (ii) can cause the arteries to narrow, raise the blood pressure and increase the risk of atherosclerosis, and (iii) smoking also changes the balance of lipoproteins in the blood.","<b>Inactivity</b><br>Sedentary lifestyle can lead to heart diseases. It also causes obesity, high blood pressure and diabetes. Regular exercise helps to prevent these adverse health effects. It also lowers blood cholesterol levels, balance lipoproteins and reduce stress. And thus, lower the risk of developing atherosclerosis and CVDs."]},{"q":"Enumerate the process of Anopheles mosquitoes in malaria transmission.","variants":[],"a":["<b>Anopheles mosquitoes in malaria transmission</b><ol><li>Female <i>Anopheles</i> mosquitoes feed on human blood to obtain the protein they need to develop their eggs. If the person they bite is infected with <i>Plasmodium</i>, they will take up some of the pathogen’s gametes with the blood meal. Male and female gametes fuse in the mosquito’s gut and develop to form infective stages, which move to the mosquito’s salivary glands. When the mosquito feeds again, she injects an anticoagulant from her salivary glands that prevents the blood meal from clotting, so that it flows out of the host into the mosquito. The infective stages pass from the mosquito’s salivary glands into the human’s blood together with the anticoagulant in the saliva. The parasites enter the red blood cells, where they multiply.</li><li>The female <i>Anopheles</i> mosquito is therefore a vector of malaria and she transmits the disease when she passes the infective stages into an uninfected person. Malaria may also be transmitted during blood transfusion and when unsterile needles are re-used. <i>Plasmodium</i> can also pass across the placenta from mother to fetus.</li></ol>"]},{"q":"Give word diagram of signs and symptoms of plant diseases.","variants":["Draw the word diagram of signs and symptoms of plant diseases."],"a":["<b>Figure. Signs and symptoms of plant diseases</b><div class='flow'><div><b>Pathogens</b>: Fungi · Bacteria · Viruses · Phytoplasma · Nematodes</div><i>+ Environment + Host ↓</i><div><b>Diseased plants</b></div><i>show ↓</i><div>Symptoms / signs: Bacterial canker · Wilt · Blight · Leaf curling · Anthracnose · Crown gall · Club root · Fruit rot · Root rot · Root knot · Leaf spot</div></div>"]},{"q":"Describe the causes and symptoms of heart attack.","variants":["How do you understand the heart attack? (Illustration is not necessary)"],"a":["Oxygen is supplied to the heart muscle by the coronary arteries. If the coronary artery becomes completely blocked by a blood clot, an area of the heart muscle will be totally cut off from its blood supply and will not receive any oxygen. This causes myocardial infarction, more commonly known as a heart attack, due to damage and death of the heart muscle. Symptoms include pain in the chest as in angina and upper body, shortness of breath and sweating. If large areas of the heart are affected, complete heart failure can occur. Death may be instantaneous without any previous symptoms or may happen after several days of feeling tired and suffering symptoms mistaken for indigestion."]},{"q":"State the physical and chemical control of plant diseases.","variants":[],"a":["<b>Physical control:</b> Physical methods of disease prevention and control are based on the physiological tolerance of disease agents to adverse conditions such as high or low temperature, absence of moisture, presence of deleterious irradiation and the removal of pathogen sources or presence of physical barriers to prevent contact between the disease agent and the host.","<b>Chemical control:</b> A variety of chemicals are available that have been designed to control plant diseases by inhibiting the growth or by killing the disease-causing pathogens. Chemicals used to control bacteria (bactericides), fungi (fungicides), and nematodes (nematicides) may be applied to seeds, foliage, flowers, fruits, or soil."]},{"q":"Tabulate some diseases of plants caused by bacteria.","variants":[],"a":["<b>Some diseases of plants caused by bacteria</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Agrobacterium</i></td><td>Crown gall of various plants</td></tr><tr><td>2</td><td><i>Erwinia</i></td><td>Fire blight of pears and apple, wilt of cucurbits and corn, soft rot of fruit</td></tr><tr><td>3</td><td><i>Pseudomonas</i></td><td>Leaf spot of tobacco, blight of peas and soybeans</td></tr><tr><td>4</td><td><i>Streptomyces</i></td><td>Scab of potato, pox of sweet potato</td></tr><tr><td>5</td><td><i>Xanthomonas</i></td><td>Blight of beans, rice and walnut, leaf spot of fruits, black rot of crucifers, citrus canker</td></tr></table>"]}],"m10":[{"q":"Provide labels and a caption to given diagram and state the non-infectious plant disease.","variants":[],"a":["<b>Labels:</b><ol><li>fungal spread</li><li>pre-penetration or germination</li><li>pathogen entrance or penetration</li><li>infection phase</li><li>growth or reproduction</li><li>dissemination or new infection</li><li>dormancy</li></ol>","<b>Caption:</b> Plant disease cycle","<b>Non-infectious plant diseases</b> are caused by unfavourable growing conditions, including extremes of temperature, disadvantageous relationships between moisture and oxygen, toxic substances in the soil or atmosphere, and an excess or deficiency of an essential mineral. Because non-infectious causal agents are not organisms capable of reproducing within a host, they are not transmissible. The study of plant diseases is called plant pathology. Pathology is derived from the two Greek words <i>pathos</i> (suffering, disease) and <i>logos</i> (discourse, study). Plant pathology thus means a study of plant diseases."]},{"q":"Explain the signs and symptoms of diseases in plant. (Illustration is not necessary)","variants":["State signs and symptoms of diseases in plants. (Illustration is not necessary)","Discuss the signs and symptoms of diseases in plant.","Explain the signs and symptoms of disease."],"a":["<b>Signs and Symptoms of Diseases</b><br><b>Signs</b> of plant disease are physical evidence of the pathogen. For example, fungal fruiting bodies, bacterial ooze, or nematode cysts. Signs can also help with plant disease identification. Signs are the actual organisms causing the disease. Signs include conks, fruiting bodies, mildew, mushrooms, mycelium, rhizomorphs, slime flux or ooze, spore masses, insects and/or their frass.","<b>Symptoms</b> are visible effects of disease on plants. Any detectable changes in colour, shape, and/or functions of the plant in response to a pathogen or disease-causing agent is a symptom. Symptoms of disease are the plant’s reaction to the causal agent.","Plant symptoms include blight, canker, chlorosis, decline, dieback, distortion, gall or gall-like, gummosis, leaf distortion, leaf scorch, leaf spot, mosaic, necrosis, stunting, wilt, witches’ broom, insect feeding injury.","Viruses cause mottling, spots, mosaic-like patterns, crinkling, and other malformations on leaves and fruits, and may stunt plants. Because viruses are systemic, infected plants must be rogued or discarded. For example, common virus diseases in Colorado include curly top virus of tomatoes, cucumber mosaic virus in tomatoes and vine crops, tomato spotted wilt virus, and a variety of greenhouse plant viruses."]},{"q":"Explain all you know about the abiotic or non-infectious diseases.","variants":["Describe plant disease is caused by nonliving factors."],"a":["<b>Abiotic or non-infectious diseases</b><br>Abiotic diseases are caused by nonliving factors, such as drought stress, sunscald, freeze injury, wind injury, chemical injury, nutrient deficiency, or improper cultural practices, such as overwatering or planting conditions. These diseases are caused by conditions external to the plant, not due to living agents. They cannot spread from plant to plant but are very common and should be considered when assessing the health of any plant. Examples of abiotic disease include nutritional deficiencies, soil compaction, salt injury, ice, and sun scorch.","Abiotic damage often occurs on many plant species. Drought stress or chemical injury will likely cause damage on several types of plants. In contrast, biotic disease problems are more limited to a certain species. For example, the fungi that cause tomato leaf blight do not cause damage on sweet corn. Abiotic damage does not spread from plant to plant over time. Abiotic diseases do not show the presence of disease signs.","Plant diseases are their occurrence and severity result from the impact of three factors. They are the host plant, the pathogen and the environmental conditions."]},{"q":"Clarify the prophylactic drugs used to treat malaria.","variants":["Explain the treatment of malaria in infectious diseases."],"a":["<b>Treating malaria</b><br><b>Quinine</b> and <b>chloroquine</b> – are anti-malarial drugs used to treat infected people. They are also used as <b>prophylactic (preventative) drugs</b>, stopping an infection occurring if a person is bitten by an infected mosquito. Prophylactic drugs are taken before, during and after visiting an area where malaria is endemic. Chloroquine inhibits protein synthesis and prevents the parasite spreading within the body. <b>Proguanil</b> is another prophylactic, has the added advantage of inhibiting the sexual reproduction of <i>Plasmodium</i> inside the biting mosquito. Where anti-malarial drugs have been used widely, there are strains of drug-resistant <i>Plasmodium</i> – the drug is no longer effective against the pathogen.","<b>Mefloquine</b> is a new drug used in South America, Africa and New Guinea. However, mefloquine is expensive and sometimes causes unpleasant side-effects such as restlessness, dizziness, vomiting and disturbed sleep. Resistance to mefloquine has developed in some areas, notably the border regions of Thailand. The antibiotic <b>doxycycline</b> is also used as a prophylactic drug. <b>Artesunate</b>, a drug derived from the plant compound artemisinin, is used in combination with mefloquine to treat infections of <i>P. falciparum</i>."]},{"q":"Give a detailed account on preventing malaria.","variants":["Briefly discuss the preventing malaria.","Write an account on preventing malaria.","Briefly explain the preventing malaria."],"a":["<b>Preventing malaria</b><br>There are three main ways to control malaria:<ul><li>reduce the number of mosquitoes,</li><li>avoid being bitten by mosquitoes and</li><li>use drugs to prevent the parasite infecting people.</li></ul>","It is possible to kill the insect vector and break the transmission cycle. Mosquitoes lay their eggs in water. Larvae hatch and develop in water but breathe air by coming to the surface. Oil can be spread over the surfaces of water to make it impossible for mosquito larvae and pupae to breathe. Marshes can be drained and vegetation cleared.","Two biological control measures that can be used are:<ul><li>stocking ponds, irrigation and drainage ditches and other permanent bodies of water with fish which feed on mosquito larvae e.g. mosquito fish <i>Gambusia affinis</i></li><li>spraying a preparation containing the bacterium <i>Bacillus thuringiensis</i>, which kills mosquito larvae but is not toxic to other forms of life</li></ul>","However, mosquitoes will lay their eggs in any small puddle or pool, which makes it impossible to completely eradicate breeding sites, especially in the rainy season.","The best protection against malaria is to avoid being bitten. People are advised to sleep beneath mosquito nets and use insect repellents. Soaking mosquito nets in insecticide every six months has been shown to reduce mortality from malaria. People should not expose their skin when mosquitoes are active at dusk."]},{"q":"List the different types of plant pathogens and clarify the morphology, function and some diseases of plants caused by bacteria with table diagram.","variants":[],"a":["<b>Different types of plant pathogens</b><ol><li>Fungi</li><li>Bacteria</li><li>Viruses</li><li>Nematodes</li></ol>","<b>Groups of plant pathogens – bacteria</b><br>Not all bacteria are bad for plants and soil. In fact, most are beneficial. However, there are approximately 200 types of bacteria that cause diseases in plants. They are most active in warm and humid environments. Bacteria that cause plant diseases are spread in many ways. They can be splashed about by rain or carried by the wind, birds or insects. Most plant pathogenic bacteria belong to the following genera: <i>Agrobacterium, Erwinia, Pseudomonas, Streptomyces</i> and <i>Xanthomonas</i>.","<b>Some diseases of plants caused by bacteria</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Agrobacterium</i></td><td>Crown gall of various plants</td></tr><tr><td>2</td><td><i>Erwinia</i></td><td>Fire blight of pears and apple, wilt of cucurbits and corn, soft rot of fruit</td></tr><tr><td>3</td><td><i>Pseudomonas</i></td><td>Leaf spot of tobacco, blight of peas and soybeans</td></tr><tr><td>4</td><td><i>Streptomyces</i></td><td>Scab of potato, pox of sweet potato</td></tr><tr><td>5</td><td><i>Xanthomonas</i></td><td>Blight of beans, rice and walnut, leaf spot of fruits, black rot of crucifers, citrus canker</td></tr></table>"]},{"q":"Give short account on the smoking, inactivity and high blood pressure as modifiable risks factors for cardiovascular disease.","variants":[],"a":["<b>Smoking</b><br>Studies have shown that smokers are far more likely to develop atherosclerosis than non-smokers with a similar lifestyle. Studies found that the substances in tobacco smoke: (i) can damage the artery linings, which makes the build-up of plaques more likely, (ii) can cause the arteries to narrow, raise the blood pressure and increase the risk of atherosclerosis, and (iii) smoking also changes the balance of lipoproteins in the blood.","<b>Inactivity</b><br>Sedentary lifestyle can lead to heart diseases. It also causes obesity, high blood pressure and diabetes. Regular exercise helps to prevent these adverse health effects. It also lowers blood cholesterol levels, balance lipoproteins and reduce stress. And thus, lower the risk of developing atherosclerosis and CVDs.","<b>High blood pressure</b><br>A healthy blood pressure is around 120 mmHg during systole and around 80 mmHg during diastole. If the blood pressure is regularly above 140/90 mmHg, it is a sign of high blood pressure or hypertension and can also be a sign of atherosclerosis. The blood pressure goes up when the walls of the arteries become less flexible due to the build-up of the plaques. This means that raised blood pressure can be the result of atherosclerosis. Measuring blood pressure is used as an indicator of both the heart and blood vessels."]},{"q":"Briefly explain the three plant diseases control methods.","variants":[],"a":["<b>Biological control</b><br>Biological control is control of plant diseases using living microorganisms. Four main mechanisms involved in the biocontrol are (i) the biological agent (antagonist) may parasite the other organism, (ii) antagonist may secrete metabolites (antibiotics) harmful to the pathogens (antibiosis) (iii) antagonist may compete with the pathogens for nutrients or space (competition) and (iv) may cause death of the parasite by producing enzymes (lysis).","<b>Physical control</b><br>Physical methods of disease prevention and control are based on the physiological tolerance of disease agents to adverse conditions such as high or low temperature, absence of moisture, presence of deleterious irradiation and the removal of pathogen sources or presence of physical barriers to prevent contact between the disease agent and the host.","<b>Chemical control</b><br>A variety of chemicals are available that have been designed to control plant diseases by inhibiting the growth or by killing the disease-causing pathogens. Chemicals used to control bacteria (bactericides), fungi (fungicides), and nematodes (nematicides) may be applied to seeds, foliage, flowers, fruits, or soil."]},{"q":"List the groups of plant pathogens and give the fully explanation on viruses.","variants":[],"a":["<b>Groups of plant pathogens</b><ol><li>Fungi</li><li>Bacteria</li><li>Viruses</li><li>Nematodes</li></ol>","<b>Groups of plant pathogens – viruses</b><br>Viruses are intracellular (inside cells) pathogenic particles that infect other living organisms. They cause human and animal diseases such as influenza, polio, rabies, smallpox, and warts. Unlike bacteria and fungi, viruses are not spread by water or wind. Instead, they must physically enter the plant. One of the most common vectors of viruses are insects. Examples of some viruses are tobacco mosaic, tomato mosaic, barley yellow dwarf, potato leaf roll, tomato spotted wilt, and tobacco ringspot.","Mosaics are characterized by the formation of light green, yellow, or white spots intermingled with the normal green aerial plant structures. Ringspots are characterized by the appearance of chlorotic or necrotic rings on the leaves. These primary symptoms may be accompanied by a variety of other symptoms in specific viral plant diseases."]},{"q":"Tabulate some diseases of plants caused by fungi and bacteria.","variants":[],"a":["<b>Some diseases of plants caused by fungi</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Alternaria</i></td><td>Leaf spots and blight of various plants</td></tr><tr><td>2</td><td><i>Aspergillus</i></td><td>Rots of seeds</td></tr><tr><td>3</td><td><i>Botrytis</i></td><td>Blights of various plants</td></tr><tr><td>4</td><td><i>Fusarium</i></td><td>Root rot of many plants</td></tr><tr><td>5</td><td><i>Puccinia</i></td><td>Rust of cereals</td></tr><tr><td>6</td><td><i>Rhizopus</i></td><td>Soft rot of fruits</td></tr><tr><td>7</td><td><i>Sclerotinia</i></td><td>Soft rot of vegetables</td></tr></table>","<b>Some diseases of plants caused by bacteria</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Agrobacterium</i></td><td>Crown gall of various plants</td></tr><tr><td>2</td><td><i>Erwinia</i></td><td>Fire blight of pears and apple, wilt of cucurbits and corn, soft rot of fruit</td></tr><tr><td>3</td><td><i>Pseudomonas</i></td><td>Leaf spot of tobacco, blight of peas and soybeans</td></tr><tr><td>4</td><td><i>Streptomyces</i></td><td>Scab of potato, pox of sweet potato</td></tr><tr><td>5</td><td><i>Xanthomonas</i></td><td>Blight of beans, rice and walnut, leaf spot of fruits, black rot of crucifers, citrus canker</td></tr></table>"]},{"q":"Explain the groups of plant pathogens by bacteria together with table.","variants":[],"a":["<b>Groups of plant pathogens – bacteria</b><br>Not all bacteria are bad for plants and soil. In fact, most are beneficial. However, there are approximately 200 types of bacteria that cause diseases in plants. They are most active in warm and humid environments. Bacteria that cause plant diseases are spread in many ways. They can be splashed about by rain or carried by the wind, birds or insects. Most plant pathogenic bacteria belong to the following genera: <i>Agrobacterium, Erwinia, Pseudomonas, Streptomyces</i> and <i>Xanthomonas</i>.","<b>Some diseases of plants caused by bacteria</b><table class='tb'><tr><th>No.</th><th>Genus</th><th>Diseases</th></tr><tr><td>1</td><td><i>Agrobacterium</i></td><td>Crown gall of various plants</td></tr><tr><td>2</td><td><i>Erwinia</i></td><td>Fire blight of pears and apple, wilt of cucurbits and corn, soft rot of fruit</td></tr><tr><td>3</td><td><i>Pseudomonas</i></td><td>Leaf spot of tobacco, blight of peas and soybeans</td></tr><tr><td>4</td><td><i>Streptomyces</i></td><td>Scab of potato, pox of sweet potato</td></tr><tr><td>5</td><td><i>Xanthomonas</i></td><td>Blight of beans, rice and walnut, leaf spot of fruits, black rot of crucifers, citrus canker</td></tr></table>"]},{"q":"Describe the causes and symptoms of stroke in cardiovascular disease.","variants":["Describe the causes and symptoms of stroke in cardiovascular disease.","Describe the causes and symptoms of stroke in cardiovascular disease. (Illustration is not necessary)"],"a":["<b>Stroke</b><br>A <b>stroke</b> is caused by an interruption to the normal blood supply to an area of the brain. This may be due to bleeding from damaged capillaries or a blockage cutting off the blood supply to the brain. A blockage is usually caused by a blood clot, an atheroma or a combination of the two. Sometimes, the blood clot forms somewhere else in the body and is carried in the bloodstream until it gets stuck, blocking an artery in the brain. The damage happens very quickly. A blockage in one of the main arteries leading to the brain causes a very serious stroke that may lead to death. If it happens in one of the smaller arterioles the effects may be less disastrous.","The symptoms of strokes vary, depending on how much of the brain is affected. Very often, the blood is cut off from one part or one side of the brain only. Symptoms include dizziness, confusion, slurred speech, blurred vision or partial loss of vision (usually one eye) and numbness. In more severe strokes, there can be paralysis, usually on one side of the body."]}]};
