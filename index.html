osis"],["Translocation is the movement of dissolved ___ through a plant.","substances"],["The umbilical vein carries oxygenated blood from the ___ into the foetus.","placenta"],["The dissolved organic compounds are transported in the ___ tissue.","phloem"],["In passive absorption, water moves through the ___ of the root.","apoplast"],["Between the capillaries and the cells is a watery liquid called ___ fluid.","tissue"],["The phloem tissue is a ___ tissue.","complex"],["The heart is made of a ___ muscle.","cardiac"],["Plasma, blood cells and ___ flow from a cut vessel.","platelets"],["Transpiration helps the shape and structure of plant parts by keeping cells ___.","turgid"]],"mcq":[["The main photosynthetic organs are the ___.",["stems","roots","leaves","flowers"],2],["The ___ transport oxygen from the lungs to all the cells.",["erythrocytes","leucocytes","lymphocytes","platelets"],0],["In plant, the dissolved mineral ions are transported in the ___ tissue.",["phloem","xylem","parenchyma","cambium"],1],["The human heart is a muscular pump with ___ chambers.",["two","three","four","five"],2],["Most transpiration takes place through the ___.",["xylem","phloem","air spaces","stomata"],3],["The very smallest branches of the arterial system are ___.",["arterioles","aorta","coronary","pulmonary"],0],["In hot conditions, ___ plays an important role in cooling the leaves.",["respiration","photosynthesis","transpiration","translocation"],2],["___ carry blood away from the heart towards the cells of the body.",["Lymph vessels","Arteries","Veins","Capillaries"],1],["Glucose can be moved through the ___ as part of the sucrose molecule.",["phloem","stomata","vessel","xylem"],0],["Which of the following vitamin is necessary for blood clotting?",["vitamin K","vitamin D","vitamin A","vitamin B"],0],["The dissolved mineral ions are transported in the ___ tissue.",["phloem","animal","xylem","plant"],2],["Veins carry blood back towards the ___.",["heart","liver","brain","cell body"],0],["Within any organism, ___ need to be moved from one place to another.",["substances","oxygen","blood","water"],0],["The right ventricle pumps blood to the ___, which are relatively close to the heart.",["lungs","stomach","liver","kidneys"],0],["The uptake of ___ can be passive transport such as diffusion and osmosis.",["substances","minerals","water","soil"],2],["The pulmonary artery carrying deoxygenated blood from the ___ to the lungs.",["brain","kidney","heart","liver"],2],["In passive absorption, water moves through the ___ of the root.",["cytoplast","chloroplast","apoplast","symplast"],2],["Carbohydrates are transported out of the leaf in the form of ___ to the stem.",["glucose","sucrose","fructose","fat"],1],["Stomata must be opened during the day to allow ___ to diffuse into the leaf for photosynthesis.",["oxygen","carbon dioxide","nitrogen","water"],1],["In a plant, the dissolved organic compounds are transported in the ___ tissue.",["xylem","phloem","meristem","cambium"],1],["Within any organism, ___ need to be moved from one place to another.",["blood","oxygen","carbon dioxide","substances"],3],["The dissolved mineral ions are transported in the ___.",["xylem tissue","phloem tissue","phloem fibre","sieve tube"],0],["The very smallest branches of the arterial system, furthest from the heart, are the ___.",["arterioles","aorta","coronary","pulmonary"],0],["Most transpiration takes place through the ___.",["xylem","guard cell","phloem","stomata"],3],["The ___ transport oxygen from the lungs to all the cells.",["leucocytes","platelets","erythrocytes","plasma"],2],["Plants make their own organic molecules, using the process of ___.",["transpiration","photosynthesis","translocation","respiration"],1],["Birds and mammals need much more ___ than fish.",["hydrogen","oxygen","carbon dioxide","nitrogen"],1],["The main photosynthetic organs are the ___.",["flowers","leaves","roots","fruits"],1],["Lymph nodes contain ___.",["red blood cells","platelets","plasma","white blood cells"],3],["Stomata must be opened during the day to allow carbon dioxide to diffuse into the leaf for ___.",["evaporation","transpiration","photosynthesis","translocation"],2],["The function of the ___ is prevention of backflow of blood from the right ventricle into the right atrium.",["bicuspid valve","mitral valve","semilunar valve","tricuspid valve"],3],["Water and dissolved salts from the soil travel upwards through the ___ of the xylem.",["parenchyma","vessels","companion cells","sieve tube"],1],["Platelets are tiny fragments of large cells called ___.",["erythrocytes","leucocytes","megakaryocytes","fibrin"],2],["Veins carry blood back towards the ___.",["muscle","brain","heart","lung"],2],["In hot conditions, transpiration plays an important role in cooling the ___.",["root","leaves","stem","fruits"],1],["Within any organisms, ___ need to be moved from one place to another.",["substances","oxygen","blood","carbon dioxide"],0],["Xylem, which transports water and ___ ions from the roots to all parts of the plant.",["organic","inorganic","mineral","substances"],1],["Platelets are ___ fragments of large cells called megakaryocytes.",["small","large","tiny","enlarge"],2],["Stomata must be opened during the day to allow carbon dioxide to diffuse into the leaf for ___.",["photosynthesis","transpiration","translocation","evaporation"],0],["The function of the ___ valve is prevention of backflow of blood from the right ventricle into the right atrium.",["semilunar","mitral","bicuspid","tricuspid"],3]],"m5":[{"q":"How do you understand the apoplastic pathway? (Illustration is not necessary)","variants":["How do you understand apoplastic pathway?","Clarify the movement of water with Apoplastic pathway.","Write the apoplastic pathway."],"a":["<b>Apoplastic pathway</b><ul><li>Most water travels via the apoplastic pathway (when transpiration rates are high), which is the series of <b>spaces</b> running through the <b>cellulose cell walls</b>, dead cells, and the hollow tubes of the xylem.</li><li>The water moves by <b>diffusion</b> (as it does not pass through a partially permeable membrane).</li><li>The water can move from cell wall to cell wall directly or through the intercellular spaces.</li><li>The movement of water through the apoplastic pathway occurs more rapidly than the symplastic pathway.</li><li>When the water reaches the endodermis the presence of a thick, waterproof, waxy band of <b>suberin</b> within the cell wall blocks the apoplastic pathway.</li><li>This band is called the <b>Casparian strip</b> and forms an impassable barrier for the water.</li></ul>"]},{"q":"Provide labels and a caption to the given diagram. (Do not copy the diagram) — Transport tissues, labels 1–10.","variants":[],"a":["<b>Labels:</b><ol><li>xylem parenchyma</li><li>vessel</li><li>tracheid</li><li>xylem fibre</li><li>phloem parenchyma</li><li>companion cell</li><li>phloem fibre</li><li>sieve tube</li><li>Xylem</li><li>Phloem</li></ol>","<b>Caption:</b> Transport tissues in plants"]},{"q":"Provide labels and caption to given diagram and clarify symplastic pathway. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>phloem parenchyma</li><li>companion cell</li><li>phloem fibre</li><li>sieve tube</li></ol>","<b>Caption:</b> Phloem","<b>Symplastic pathway</b><ul><li>A smaller amount of water travels via the symplastic pathway, which is the <b>cytoplasm</b> and <b>plasmodesmata</b> or vacuole of the cells.</li><li>The water moves by <b>osmosis</b> into the cell (across the partially permeable cell surface membrane), possibly into the vacuole (through the tonoplast by osmosis) and between cells through the plasmodesmata.</li><li>The movement of water in the symplastic pathway is slower than the apoplastic pathway.</li></ul>"]},{"q":"Give a flow diagram of blood clotting process.","variants":[],"a":["<b>Flow diagram of clotting process</b><div class='flow'><div>damaged tissues</div><i>release ↓</i><div>platelets</div><i>release ↓</i><div>thromboplastin</div><i>catalyses ↓ (with <b>Ca²⁺</b>)</i><div>prothrombin → <b>thrombin</b></div><i>catalyses ↓</i><div>fibrinogen → <b>fibrin</b></div><i>forms ↓</i><div><b>clot</b></div></div>"]},{"q":"State the single circulatory system in fish with suitable diagram.","variants":[],"a":["<b>Figure. Single circulatory system in fish</b><ul><li>capillaries in gills</li><li>gill cover</li><li>capillaries in other parts of body</li><li>ventricle</li><li>atrium</li></ul>","<b>Single circulatory system</b><br>It is found in fish. The heart pumps deoxygenated blood to the gills, the organs of gas exchange where the blood takes in oxygen (becomes oxygenated) and gives up carbon dioxide at the same time. The blood then travels on around the rest of the body of the fish, giving up oxygen to the body cells before returning to the heart. In this type, blood passes once through the heart."]},{"q":"Provide labels and caption to the given diagram and describe the nature of phloem tissue in plant. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>epidermis</li><li>phloem</li><li>xylem</li><li>pith</li><li>cortex</li><li>vascular bundles</li></ol>","<b>Caption:</b> Transverse section of stem","Phloem tissue contains cells called <b>sieve tube</b>. Unlike xylem vessel, these are living cells and contain cytoplasm and a few organelles but no nucleus. Their walls are made of cellulose. A <b>companion cell</b> is associated with each sieve tube."]},{"q":"Draw a labelled diagram of transport tissues in plants and state their functions.","variants":[],"a":["<b>Figure. Transport tissues in plants</b>","<b>Labels:</b><ol><li>xylem parenchyma</li><li>vessel</li><li>tracheid</li><li>xylem fibre</li></ol>","<b>Caption:</b> Xylem","<b>Labels:</b><ol><li>phloem parenchyma</li><li>companion cell</li><li>phloem fibre</li><li>sieve tube</li></ol>","<b>Caption:</b> Phloem","<b>Caption:</b> Phloem","Plants have two transport systems:<ul><li><b>Xylem</b>, which transports water and inorganic ions from the roots to all parts of the plant.</li><li><b>Phloem</b>, which transports substances made in the plant, such as sucrose and amino acids, from the leaves to all other parts of the plant.</li></ul>","Xylem tissue contains dead, empty hollow cells with no end walls. These are composed of <b>xylem vessels</b> which are arranged in long lines to form a hollow tube. Water moves through these long, hollow tubes by mass flow from the roots to all other parts of the plant."]},{"q":"Provide labels and caption to the given diagram and explain the single circulatory system. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>capillaries in gills</li><li>gill cover</li><li>capillaries in other parts of body</li><li>ventricle</li><li>atrium</li></ol>","<b>Caption:</b> Single circulatory system in fish","<b>Single circulatory system</b><br>It is found in fish. The heart pumps deoxygenated blood to the gills, the organs of gas exchange where the blood takes in oxygen (becomes oxygenated) and gives up carbon dioxide at the same time. The blood then travels on around the rest of the body of the fish, giving up oxygen to the body cells before returning to the heart. In this type, blood passes once through the heart."]},{"q":"Provide labels and a caption to the given diagram. (Do not copy the diagram) — transverse sections of root and stem.","variants":[],"a":["<b>Labels:</b><ol><li>xylem</li><li>vascular bundle</li><li>phloem</li><li>epidermis</li></ol>","<b>Caption:</b> Transverse section of root","<b>Labels:</b><ol><li>epidermis</li><li>phloem</li><li>xylem</li><li>pith</li><li>cortex</li><li>vascular bundles</li></ol>","<b>Caption:</b> Transverse section of stem"]},{"q":"Provide labels and a caption to given diagram and describe the single circulatory system in fish. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>capillaries in gills</li><li>gill cover</li><li>capillaries in other parts of body</li><li>atrium</li><li>ventricle</li></ol>","<b>Caption:</b> Single circulatory system in fish","<b>Single circulatory system</b><br>It is found in fish. The heart pumps deoxygenated blood to the gills, the organs of gas exchange where the blood takes in oxygen (becomes oxygenated) and gives up carbon dioxide at the same time. The blood then travels on around the rest of the body of the fish, giving up oxygen to the body cells before returning to the heart. In this type, blood passes once through the heart."]},{"q":"List any five benefits of transpiration in plants.","variants":[],"a":["<b>Benefits of Transpiration</b><ul><li><b>Ascent of sap</b> – Ascent of sap mostly occurs due to transpiration pull exerted by transpiration of water. This pull also helps in absorption of water.</li><li><b>Removal of excess water</b> – It has been held that plants absorb far more amount of water than is actually required by them. Transpiration, therefore, removes the excess of water.</li><li><b>Cooling effect</b> – Radiant heat falling on the plants increases their temperature that may be dangerous to the plants. Transpiration, by evaporating water, bring down (or lowers) their temperature by 10°–15°C.</li><li><b>Mechanical tissue</b> – The development of mechanical tissue, which is essential for providing rigidity and strength to the plant, is favoured by the increase in transpiration.</li><li><b>Distribution of mineral salts</b> – Mineral salts are mostly distributed by rising column of sap.</li></ul>"]},{"q":"Write a precise explanation on plasma of the blood.","variants":["Briefly explain the liquid part of the blood."],"a":["<b>Plasma</b><br>Plasma is the liquid part of the blood. Over 50% of the blood volume in the body is plasma, and it carries all of blood cells and everything else that needs transporting around the body. This includes:<ol><li>digested food products (e.g., glucose and amino acids) from the small intestine to the liver and then to all the parts of the body where they are needed either for immediate use or for storage,</li><li>nutrient molecules from storage areas to the cells that need them,</li><li>excretory products (e.g., carbon dioxide and urea) from cells to the excretory organs such as the lungs or kidneys, to be excreted from the body,</li><li>chemical messages (hormones) from where they are made to the target organs in the body,</li><li>carries heat around the system from internal organs (e.g., the gut) or very active tissues (e.g., leg muscles in someone running) to the skin, where it can be lost to the surroundings,</li><li>also acts as a buffer to regulate pH changes.</li></ol>"]},{"q":"Explain the capillaries of human blood vessels. (Illustration is not necessary)","variants":[],"a":["<b>Capillaries</b><br>Capillaries have a very simple structure which is well adapted to their function. Their walls are very thin and contain no elastic fibers, smooth muscle or collagen. This helps them fit between individual cells and allows rapid diffusion of substances between the blood and the cells. The walls consist of just one very thin cell. Oxygen and other molecules, such as digested food molecules and hormones, quickly diffuse out of the blood in the capillaries into the nearby body cells, and carbon dioxide and other waste molecules diffuse into the capillaries. Blood entering the capillary network from the arteries is oxygenated. When it leaves, it carries less oxygen and more carbon dioxide."]},{"q":"Mention the nature of leucocytes or white blood cell. (Illustration is not necessary)","variants":[],"a":["<b>Leucocytes or white blood cells</b><br>They are much larger than erythrocytes but can also squeeze through tiny blood vessels because they can change their shape. There are around 4000 – 11000 per mm³ of blood and there are several different types. They are made in the bone marrow, although some mature in the thymus gland. Their main function is to defend the body against infection.","Leucocytes are also very important in the inflammatory response of the body when an area of tissue is damaged. They all contain a nucleus and have colourless cytoplasm, although some types contain granules which can be stained."]},{"q":"State the needed reasons for transport systems.","variants":[],"a":["<b>Transport systems are needed for the following reasons:</b><ul><li>To move substances from where they are absorbed to where they are needed, for example, water and mineral ions are absorbed by roots and transported through the xylem to other parts of the plant.</li><li>To move substances from where they are produced to where they are needed for metabolism. For example, sugars are produced in leaves, but glucose is needed by all parts of the plant for respiration and for converting to cellulose for making cell walls in areas of growth. Glucose can be moved through the phloem as part of the sucrose molecule.</li><li>To move substances to a certain part of the plant for storage, for example, sugars usually change into the form of starch, for storage in a potato tuber.</li></ul>"]},{"q":"List the advantages of double circulation system.","variants":["List the advantages of double circulation."],"a":["<b>The advantages of double circulation are:</b><ol><li>The separate circuits of a double circulatory system ensure that the oxygenated and deoxygenated blood cannot mix, so the tissues receive as much oxygen as possible.</li><li>The fully oxygenated blood can be delivered quickly to the body tissues at high pressure.</li><li>The blood going through the tiny blood vessels in the lungs is at relatively low pressure, so it does not damage the vessels and allows gas exchange to take place.</li><li>When the oxygenated blood returns to the heart, it can be pumped hard and sent around the body at high pressure. This means it reaches all the tiny capillaries between the body cells quickly, supplying oxygen for an active way of life.</li></ol>"]},{"q":"Give labelled diagram of the external view of human heart and state two sets of atrioventricular valves. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>right ventricle</li><li>right atrium</li><li>vena cava</li><li>aorta</li><li>pulmonary artery</li><li>pulmonary vein</li><li>left atrium</li><li>coronary arteries</li><li>left ventricle</li></ol>","<b>Caption:</b> Structure of the human heart (External view)","<b>The right atrioventricular valve</b> is called <b>tricuspid valve</b> which is made up of three flaps and is located between the right atrium and right ventricle. The function of the tricuspid valve is prevention of backflow of blood from the right ventricle into the right atrium.","<b>The left atrioventricular valve</b> is called <b>bicuspid valve</b> (Mitral valve) which is made up of two flaps and is located between the left atrium and left ventricle. Its function is prevention of backflow of blood from the left ventricle into the left atrium."]}],"m10":[{"q":"Clarify the blood clotting process.","variants":[],"a":["<b>The blood clotting process</b><br>The blood clotting process is a very complex sequence of events in which there are many different clotting factors. Vitamin K is important in the production of many of the compounds needed for the blood to clot, including prothrombin. The events in the blood clotting process is as follow;","<b>First</b>, thromboplastin catalyses the conversion of a large soluble protein called <b>prothrombin</b> found in the plasma into another soluble protein, the enzyme called <b>thrombin</b>. Prothrombin, a precursor of thrombin, is biologically inactive while thrombin is biologically active. This conversion happens on a large scale at the site of a wound. Calcium ions need to be present in the blood at the right concentration for this reaction to happen.","<b>Second</b>, thrombin acts on another soluble plasma protein called <b>fibrinogen</b>, converting it to an insoluble substance called <b>fibrin</b>. Again, fibrinogen is the biologically inactive precursor of biologically active fibrin.","<b>Finally</b>, the fibrin forms a mesh of fibres to cover the wound and trap the red blood cells, forming blood clot."]},{"q":"With flow diagram, describe the blood clotting process.","variants":["Describe the blood clotting process with flow chart diagram."],"a":["<b>Flow diagram of clotting process</b><div class='flow'><div>damaged tissues</div><i>release ↓</i><div>platelets</div><i>release ↓</i><div>thromboplastin</div><i>catalyses ↓ (with <b>Ca²⁺</b>)</i><div>prothrombin → <b>thrombin</b></div><i>catalyses ↓</i><div>fibrinogen → <b>fibrin</b></div><i>forms ↓</i><div><b>clot</b></div></div>","<b>The blood clotting process</b><br>The blood clotting process is a very complex sequence of events in which there are many different clotting factors. Vitamin K is important in the production of many of the compounds needed for the blood to clot, including prothrombin. The events in the blood clotting process is as follow;","<b>First</b>, thromboplastin catalyses the conversion of a large soluble protein called <b>prothrombin</b> found in the plasma into another soluble protein, the enzyme called <b>thrombin</b>. Prothrombin, a precursor of thrombin, is biologically inactive while thrombin is biologically active. This conversion happens on a large scale at the site of a wound. Calcium ions need to be present in the blood at the right concentration for this reaction to happen.","<b>Second</b>, thrombin acts on another soluble plasma protein called <b>fibrinogen</b>, converting it to an insoluble substance called <b>fibrin</b>. Again, fibrinogen is the biologically inactive precursor of biologically active fibrin.","<b>Finally</b>, the fibrin forms a mesh of fibres to cover the wound and trap the red blood cells, forming blood clot."]},{"q":"Discuss on the veins in the main types of blood vessels. (Illustration is not necessary)","variants":[],"a":["<b>Veins</b><br>Veins carry blood back towards the heart. Most veins carry deoxygenated blood. The exceptions are the pulmonary vein, carries oxygen-rich blood from the lungs back to the heart for circulation around the body and the umbilical vein, carries oxygenated blood from the placenta into the foetus, during pregnancy.","Tiny venules lead from the capillary network, combining into larger and larger vessels going back to the heart as vena cava (large vein). Veins can hold a large volume of blood, in fact more than half of the body’s blood volume is in the veins at any one time. They act as a blood reservoir. The blood pressure in the veins is relatively low and the pressure surges from the heart are eliminated before the blood reaches the capillary system. This blood at low pressure must be returned to the heart and lungs to be oxygenated again and recirculated. The walls of the veins are thinner than those of the arteries and contain less elastic tissue and muscle.","There are one-way valves frequent intervals throughout the venous system. These are called semilunar valves because of their half-moon shape. They develop from unfoldings of the inner wall of the vein. Blood can pass through towards the heart, but if it starts to flow backwards the valves close, preventing any backflow. The contraction of large muscles encourages blood flow through the veins."]},{"q":"Explain the four sets of valves in human heart and provide labels and caption to the given diagram.","variants":[],"a":["<b>Labels:</b><ol><li>left ventricle</li><li>coronary arteries</li><li>left atrium</li><li>pulmonary vein</li><li>pulmonary artery</li><li>aorta</li><li>vena cava</li><li>right atrium</li><li>right ventricle</li></ol>","<b>Caption:</b> Structure of the human heart","<b>Four sets of valves in the heart</b><br>There are four sets of valves in the heart; two sets of atrioventricular valves and two sets of semilunar valves.","<b>The right atrioventricular valve</b> is called <b>tricuspid valve</b> which is made up of three flaps and is located between the right atrium and right ventricle. The function of the tricuspid valve is prevention of backflow of blood from the right ventricle into the right atrium.","<b>The left atrioventricular valve</b> is called <b>bicuspid valve</b> (Mitral valve) which is made up of two flaps and is located between the left atrium and left ventricle. Its function is prevention of backflow of blood from the left ventricle into the left atrium.","The flaps of both atrioventricular valves are supported by the cordae tendineae (tendinous cords) which prevent the flaps from turning inside out by the pressure exerted when the ventricles contract.","<b>Semilunar valves</b> (semi means half and lunar means moon) – Both are pocket-like valves with half-moon shaped like those in veins. One set is located at the base of the pulmonary artery while the other set is at the base of the aorta and their function is prevention of backflow of blood from the pulmonary artery into the right ventricle and from the aorta into the left ventricle, respectively."]},{"q":"Provide labels and a caption to given diagram and explain four sets of valves in the heart. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>right ventricle</li><li>right atrium</li><li>vena cava</li><li>aorta</li><li>pulmonary artery</li><li>pulmonary vein</li><li>left atrium</li><li>coronary arteries</li><li>left ventricle</li></ol>","<b>Caption:</b> Structure of the human heart","<b>Four sets of valves in the heart</b><br>There are four sets of valves in the heart; two sets of atrioventricular valves and two sets of semilunar valves.","<b>The right atrioventricular valve</b> is called <b>tricuspid valve</b> which is made up of three flaps and is located between the right atrium and right ventricle. The function of the tricuspid valve is prevention of backflow of blood from the right ventricle into the right atrium.","<b>The left atrioventricular valve</b> is called <b>bicuspid valve</b> (Mitral valve) which is made up of two flaps and is located between the left atrium and left ventricle. Its function is prevention of backflow of blood from the left ventricle into the left atrium.","The flaps of both atrioventricular valves are supported by the cordae tendineae (tendinous cords) which prevent the flaps from turning inside out by the pressure exerted when the ventricles contract.","<b>Semilunar valves</b> (semi means half and lunar means moon) – Both are pocket-like valves with half-moon shaped like those in veins. One set is located at the base of the pulmonary artery while the other set is at the base of the aorta and their function is prevention of backflow of blood from the pulmonary artery into the right ventricle and from the aorta into the left ventricle, respectively."]},{"q":"Describe the active and passive absorption pathways of water movement in plants. (Illustration is not necessary)","variants":[],"a":["<b>Apoplastic pathway</b><ul><li>Most water travels via the apoplastic pathway (when transpiration rates are high), which is the series of <b>spaces</b> running through the <b>cellulose cell walls</b>, dead cells, and the hollow tubes of the xylem.</li><li>The water moves by <b>diffusion</b> (as it does not pass through a partially permeable membrane).</li><li>The water can move from cell wall to cell wall directly or through the intercellular spaces.</li><li>The movement of water through the apoplastic pathway occurs more rapidly than the symplastic pathway.</li><li>When the water reaches the endodermis the presence of a thick, waterproof, waxy band of <b>suberin</b> within the cell wall blocks the apoplastic pathway.</li><li>This band is called the <b>Casparian strip</b> and forms an impassable barrier for the water.</li></ul>","<b>Symplastic pathway</b><ul><li>A smaller amount of water travels via the symplastic pathway, which is the <b>cytoplasm</b> and <b>plasmodesmata</b> or vacuole of the cells.</li><li>The water moves by <b>osmosis</b> into the cell (across the partially permeable cell surface membrane), possibly into the vacuole (through the tonoplast by osmosis) and between cells through the plasmodesmata.</li><li>The movement of water in the symplastic pathway is slower than the apoplastic pathway.</li></ul>"]},{"q":"Provide labels and a caption to the given diagram and describe two transport systems in plants. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>xylem parenchyma</li><li>vessel</li><li>tracheid</li><li>xylem fibre</li></ol>","<b>Caption:</b> Xylem","<b>Labels:</b><ol><li>phloem parenchyma</li><li>companion cell</li><li>phloem fibre</li><li>sieve tube</li></ol>","<b>Caption:</b> Phloem","Plants have two transport systems:<ul><li><b>Xylem</b>, which transports water and inorganic ions from the roots to all parts of the plant.</li><li><b>Phloem</b>, which transports substances made in the plant, such as sucrose and amino acids, from the leaves to all other parts of the plant.</li></ul>","Xylem tissue contains dead, empty hollow cells with no end walls. These are composed of <b>xylem vessels</b> which are arranged in long lines to form a hollow tube. Water moves through these long, hollow tubes by mass flow from the roots to all other parts of the plant.","Phloem tissue contains cells called <b>sieve tube</b>. Unlike xylem vessel, these are living cells and contain cytoplasm and a few organelles but no nucleus. Their walls are made of cellulose. A <b>companion cell</b> is associated with each sieve tube."]},{"q":"Draw a fully labelled diagram and caption to the arteries as found in mammals and enumerate the role of plasma for transporting substances around the body.","variants":[],"a":["<b>Figure. Artery</b><ul><li>connective tissue</li><li>fibrous tissue</li><li>smooth muscle</li><li>elastic fibres</li><li>endothelium</li><li>lumen</li></ul>","<b>Plasma:</b> see Questions No.4 (12).","<b>Plasma</b><br>Plasma is the liquid part of the blood. Over 50% of the blood volume in the body is plasma, and it carries all of blood cells and everything else that needs transporting around the body. This includes:<ol><li>digested food products (e.g., glucose and amino acids) from the small intestine to the liver and then to all the parts of the body where they are needed either for immediate use or for storage,</li><li>nutrient molecules from storage areas to the cells that need them,</li><li>excretory products (e.g., carbon dioxide and urea) from cells to the excretory organs such as the lungs or kidneys, to be excreted from the body,</li><li>chemical messages (hormones) from where they are made to the target organs in the body,</li><li>carries heat around the system from internal organs (e.g., the gut) or very active tissues (e.g., leg muscles in someone running) to the skin, where it can be lost to the surroundings,</li><li>also acts as a buffer to regulate pH changes.</li></ol>"]},{"q":"Clarify the components of blood plasma and white blood cells.","variants":[],"a":["<b>Plasma</b><br>Plasma is the liquid part of the blood. Over 50% of the blood volume in the body is plasma, and it carries all of blood cells and everything else that needs transporting around the body. This includes:<ol><li>digested food products (e.g., glucose and amino acids) from the small intestine to the liver and then to all the parts of the body where they are needed either for immediate use or for storage,</li><li>nutrient molecules from storage areas to the cells that need them,</li><li>excretory products (e.g., carbon dioxide and urea) from cells to the excretory organs such as the lungs or kidneys, to be excreted from the body,</li><li>chemical messages (hormones) from where they are made to the target organs in the body,</li><li>carries heat around the system from internal organs (e.g., the gut) or very active tissues (e.g., leg muscles in someone running) to the skin, where it can be lost to the surroundings,</li><li>also acts as a buffer to regulate pH changes.</li></ol>","<b>Leucocytes or white blood cells</b><br>They are much larger than erythrocytes but can also squeeze through tiny blood vessels because they can change their shape. There are around 4000 – 11000 per mm³ of blood and there are several different types. They are made in the bone marrow, although some mature in the thymus gland. Their main function is to defend the body against infection.","Leucocytes are also very important in the inflammatory response of the body when an area of tissue is damaged. They all contain a nucleus and have colourless cytoplasm, although some types contain granules which can be stained."]},{"q":"Define the term translocation and describe the important role of phloem tissue.","variants":[],"a":["<b>Translocation</b> is the movement of dissolved substances through a plant. In general, water and dissolved salts from the soil travel upwards through the vessels of the xylem and food synthesized in the leaves passes downwards or upwards in the sieve tubes of the phloem.","The phloem tissue is a <b>complex tissue</b>. The consisting components are sieve tube, companion cell, phloem parenchyma and phloem fibre. They are living cells except phloem fibre. In the translocation process, sieve tubes or sieve cells which have no nucleus and companion cells possess do work together. They are so called because of the presence of perforations in the cell septate walls known as sieve plates. These are main components through which translocation take place and permit the plant materials to pass from one cell to another.","Sieve cells can manage translocation without nuclei because they are kept alive by the nucleated companion cells that always situated adjacent to sieve cells. There are profuse cytoplasmic connections between sieve and companion cells. Moreover, phloem tissue is strengthened by fibre cells besides the sieve and companion cells."]},{"q":"Provide labels and a caption to the given diagram and explain the lymphatic system. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>blood from artery enters capillary network</li><li>part of blood plasma leaks out of capillary forming tissue fluid</li><li>some tissue fluid re-enters capillaries</li><li>excess tissue fluid drains into lymph vessels</li><li>blood from capillaries passes vein</li><li>part of capillary network</li><li>cells</li><li>valves to prevent backflow</li><li>lymph returns to blood</li><li>lymph node</li><li>lymph vessels</li></ol>","<b>Caption:</b> Relationship between capillaries and the cells","<b>Lymphatic System</b><br>Between the capillaries and the cells is a watery liquid called tissue fluid. Most of the water from tissue fluid reenters capillaries by osmosis. Some fluid passes into another system called the lymphatic system. The lymphatic system consists of vessels similar to blood capillaries, which are sometimes called lymphatic capillaries. They transport the fluid, called lymph, back to the blood by opening into the subclavian veins. The lacteals that carry fats from villi of the small intestine are part of the lymphatic system. Before lymph passes back into the blood, it is filtered to remove dead cells and bacteria. This takes place in swellings called lymph nodes, which contains white blood cells that are important in destroying harmful bacteria. When a person gets infection, one of the first sign may be swelling of the lymph nodes, often referred to as swollen glands."]},{"q":"Provide labels and a caption to given diagram and describe demonstration of transpiration pull. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>rubber stopper</li><li>thistle funnel</li><li>water</li><li>mercury</li></ol>","<b>Caption:</b> Demonstration of transpiration pull","<b>Demonstration of Transpiration Pull</b><br>A thistle funnel is filled with water and rubber stopper attaches a leafy twig to it. The bottom of the funnel is immersed in a bowl of mercury.","After some time, the level of mercury in the thistle funnel rises. Loss of water from the twig (i.e., transpiration) produces a vacuum in the thistle funnel and water will be drawn up. This in turn produces a vacuum at the bottom of the funnel, which is then filled by the rising mercury. This rise of water and mercury is due to transpiration pull."]},{"q":"Provide labels and a caption to given diagram and explain the four environmental factors affecting the rate of transpiration. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>rubber stopper</li><li>thistle funnel</li><li>water</li><li>mercury</li></ol>","<b>Caption:</b> Demonstration of transpiration pull","<b>Factors Affecting Transpiration</b><br>The environmental factors affecting the rate of transpiration are:<ul><li><b>Humidity</b> – If the water potential gradient between the air spaces in the leaf and the air outside becomes steeper, the rate of transpiration will increase. In condition of low humidity, the gradient is steep, so transpiration takes place more quickly than in high humidity.</li><li><b>Wind speed and temperature</b> – Transpiration rate may also be increased by an increasing in wind speed or rising in temperature.</li><li><b>Light intensity</b> – In most plants, stomata open during the day and close at night. Most transpiration takes place through the stomata, so the rate of transpiration is almost zero at night. Stomata must be opened during the day to allow carbon dioxide to diffuse into the leaf for photosynthesis. This inevitably increases the rate of transpiration. Closing at night, when photosynthesis is impossible, reduces unnecessary water loss.</li><li><b>Very dry conditions</b> – In especially dry conditions, when the water potential gradient between the internal air spaces and the external air is steep, a plant may have to compromise by partially or completely closing its stomata to prevent its leaves drying out, even if this mean reducing the rate of photosynthesis.</li></ul>","In hot conditions, transpiration plays an important role in cooling the leaves. As water evaporates from the cell walls inside the leaf, it absorbs heat energy from these cells, thus reducing their temperature. If the rate at which water vapour is lost by transpiration exceeds the rate at which a plant can take up water from the soil, then the amount of water in its cells decreases. The cells become less turgid and the plant wilts as the soft parts such as leaves loose the support provided turgid cells. In this situation, the plant will also close its stomata."]},{"q":"Discuss the four environmental factors affecting the rate of transpiration.","variants":["Enumerate the environmental factors affecting the rate of transpiration."],"a":["<b>Factors Affecting Transpiration</b><br>The environmental factors affecting the rate of transpiration are:<ul><li><b>Humidity</b> – If the water potential gradient between the air spaces in the leaf and the air outside becomes steeper, the rate of transpiration will increase. In condition of low humidity, the gradient is steep, so transpiration takes place more quickly than in high humidity.</li><li><b>Wind speed and temperature</b> – Transpiration rate may also be increased by an increasing in wind speed or rising in temperature.</li><li><b>Light intensity</b> – In most plants, stomata open during the day and close at night. Most transpiration takes place through the stomata, so the rate of transpiration is almost zero at night. Stomata must be opened during the day to allow carbon dioxide to diffuse into the leaf for photosynthesis. This inevitably increases the rate of transpiration. Closing at night, when photosynthesis is impossible, reduces unnecessary water loss.</li><li><b>Very dry conditions</b> – In especially dry conditions, when the water potential gradient between the internal air spaces and the external air is steep, a plant may have to compromise by partially or completely closing its stomata to prevent its leaves drying out, even if this mean reducing the rate of photosynthesis.</li></ul>","In hot conditions, transpiration plays an important role in cooling the leaves. As water evaporates from the cell walls inside the leaf, it absorbs heat energy from these cells, thus reducing their temperature. If the rate at which water vapour is lost by transpiration exceeds the rate at which a plant can take up water from the soil, then the amount of water in its cells decreases. The cells become less turgid and the plant wilts as the soft parts such as leaves loose the support provided turgid cells. In this situation, the plant will also close its stomata."]},{"q":"Describe the benefits of transpiration.","variants":[],"a":["<b>Benefits of Transpiration</b><br>Transpiration is regarded as a beneficial fact to the plants for many reasons:<ul><li><b>Ascent of sap</b> – Ascent of sap mostly occurs due to transpiration pull exerted by transpiration of water. This pull also helps in absorption of water.</li><li><b>Removal of excess water</b> – It has been held that plants absorb far more amount of water than is actually required by them. Transpiration, therefore, removes the excess of water.</li><li><b>Cooling effect</b> – Radiant heat falling on the plants increases their temperature that may be dangerous to the plants. Transpiration, by evaporating water, bring down (or lowers) their temperature by 10°–15°C.</li><li><b>Mechanical tissue</b> – The development of mechanical tissue, which is essential for providing rigidity and strength to the plant, is favoured by the increase in transpiration.</li><li><b>Distribution of mineral salts</b> – Mineral salts are mostly distributed by rising column of sap.</li><li><b>Increasing concentration of mineral salts</b> – The sap absorbed from the soil contains low concentration of mineral salts. The loss of water through transpiration increases the concentration of mineral salts in the plant.</li><li><b>Root system</b> – Transpiration helps in better development of root system, which is required for support, and absorption of mineral salts.</li><li><b>Quality of fruits</b> – The ash and sugar content of the fruit increases with the increase in transpiration.</li><li><b>Resistance</b> – Excessive transpiration induces hardening and resistant to moderate drought.</li><li><b>Turgidity</b> – Transpiration helps the shape and structure of plant parts by keeping cells turgid.</li><li><b>Photosynthesis</b> – Transpiration supplies water for photosynthesis. As water evaporates through the stomata, it results in pulling of water, molecule by molecule into the leaf from the xylem.</li></ul>"]},{"q":"Describe the arteries in the main types of blood vessel. (Illustration is not necessary)","variants":[],"a":["<b>Arteries</b><br>Arteries carry blood away from the heart towards the cells of the body.","Almost all arteries carry oxygenated blood. The exceptions are: the pulmonary artery – carrying deoxygenated blood from the heart to the lungs and the umbilical artery – during pregnancy, this carries deoxygenated blood from the foetus to the placenta.","The aorta (large artery) leaving the heart branches off into arteries in every direction, and the diameter of the lumen, the central space inside the blood vessel, gets smaller the further away it is from the heart. The very smallest branches of the arterial system, furthest from the heart, are the arterioles.","The major arteries close to the heart must withstand pressure surges. Their walls contain a lot of elastic fibers so they can stretch to accommodate the greater volume of blood without being damaged. Between surges, the elastic fibers return to their original length, squeezing the blood to move it along in a continuous flow. The role of the elastic fibers in artery walls is to return to their original length to help maintain the pressure. This is called recoil. The elastic recoil does not help to increase pressure, it simply helps to maintain the pressure. A thick muscular wall helps control the flow of blood by dilating (widening) or constricting (narrowing) the vessels."]},{"q":"Provide labels and caption to the given diagram and explain the apoplastic pathway. (Do not copy the diagram)","variants":["Provide labels and caption to the given diagram and explain the apoplastic pathway. (Illustration is not essential)","Provide labels and caption to the given diagram and explain the apoplastic pathway."],"a":["<b>Labels:</b><ol><li>symplastic route</li><li>apoplastic route</li><li>plasma membrane</li><li>casparian strip</li><li>vessels (xylem)</li><li>stele (vascular cylinder)</li><li>endodermis</li><li>cortex</li><li>epidermis</li><li>root hair</li></ol>","<b>Caption:</b> Apoplastic and symplastic pathway","<b>Apoplastic pathway</b><ul><li>Most water travels via the apoplastic pathway (when transpiration rates are high), which is the series of <b>spaces</b> running through the <b>cellulose cell walls</b>, dead cells, and the hollow tubes of the xylem.</li><li>The water moves by <b>diffusion</b> (as it does not pass through a partially permeable membrane).</li><li>The water can move from cell wall to cell wall directly or through the intercellular spaces.</li><li>The movement of water through the apoplastic pathway occurs more rapidly than the symplastic pathway.</li><li>When the water reaches the endodermis the presence of a thick, waterproof, waxy band of <b>suberin</b> within the cell wall blocks the apoplastic pathway.</li><li>This band is called the <b>Casparian strip</b> and forms an impassable barrier for the water.</li></ul>"]}]};

function chips(a){
  const g={};const order=[];
  uniq(a).forEach(t=>{const m=/^(\d\d)([DO])(\d*)$/.exec(t);const k=m[1]+m[2];if(!g[k]){g[k]=[];order.push(k);}if(m[3])g[k].push(+m[3]);});
  order.sort();
  return '<span class="yrs">'+order.map(k=>{const n=g[k].sort((x,y)=>x-y);
    return `<span class="yr y${k.slice(0,2)}">20${k.slice(0,2)} · ${k[2]==='D'?'Domestic '+n.join(', '):'Overseas'}</span>`;}).join('')+'</span>';}

function renderChapter(){
  const c = CHAPTERS.find(x=>x.no===ch), d = DATA[ch];
  backBtn.classList.remove('hidden');
  titleEl.innerHTML=`Chapter ${c.no} — ${c.name}<small>Grade 12 Biology</small>`;
  let h = '<div class="tabs">'+TABS.map(t=>`<button class="tab ${t.id===tab?'on':''}" onclick="setTab('${t.id}')">${t.label}<small>${t.sub} · ${d[t.id].length}</small></button>`).join('')+'</div>'+yfRow();
  if(tab==='tf'||tab==='fill'||tab==='mcq'){
    const n=d[tab].length;
    h+=`<div class="bar"><div class="info">${n} questions</div>
      <button class="btn gold" onclick="checkAll()">Check Answers</button>
      <button class="btn big" onclick="toggleAll()" id="allBtn">👁 Show All Answers</button>
      <button class="btn gray" onclick="renderChapter()">Reset</button></div>
      <div class="score" id="score"></div><div id="list">`;
    if(tab==='tf'){ sel.tf={}; h+=d.tf.map((x,i)=>`<div class="card" id="c${i}" data-y="${ya(i)}"><div class="q"><b class="n">(${i+1})</b>${x[0]}${chips(Y.tf[i])}</div>
       <div class="choices"><button class="ch tfb" data-i="${i}" data-v="1" onclick="pick(${i},1)">TRUE</button><button class="ch tfb" data-i="${i}" data-v="0" onclick="pick(${i},0)">FALSE</button></div>
       <div class="ans"><b>Answer: ${x[1]?'TRUE':'FALSE'}</b></div>${showBtn(i)}</div>`).join(''); }
    if(tab==='fill'){ sel.fill={}; h+=d.fill.map((x,i)=>{
       const q=x[0].replace('___',`<input class="blank" id="f${i}" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="sel.fill[${i}]=this.value">`);
       return `<div class="card" id="c${i}" data-y="${ya(i)}"><div class="q"><b class="n">(${i+1})</b>${q}${chips(Y.fill[i])}</div><div class="ans"><b>Answer: ${x[1]}</b></div>${showBtn(i)}</div>`;}).join(''); }
    if(tab==='mcq'){ sel.mcq={}; h+=d.mcq.map((x,i)=>`<div class="card" id="c${i}" data-y="${ya(i)}"><div class="q"><b class="n">(${i+1})</b>${x[0].replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}${chips(Y.mcq[i])}</div>
       <div class="choices four">${x[1].map((o,k)=>`<button class="ch" data-i="${i}" data-v="${k}" onclick="pick(${i},${k})"><b>${L[k]}.</b> ${o}</button>`).join('')}</div>
       <div class="ans"><b>Answer: ${L[x[2]]}. ${x[1][x[2]]}</b></div>${showBtn(i)}</div>`).join(''); }
    h+='</div>';
  } else {
    const isM5 = tab==='m5';
    h+=`<div class="bar"><div class="info">${isM5?'5-mark questions — answer ALL (30 marks)':'10-mark questions — answer any FOUR (40 marks)'}</div>
      <button class="btn big" onclick="toggleAll()" id="allBtn">👁 Show All Answers</button></div>
      <div class="note">◆ lines are alternative wordings of the same question. Answers are taken from the textbook answer section.</div><div id="list">`;
    h+=d[tab].map((x,i)=>`<div class="card" id="c${i}" data-y="${ya(i)}"><div class="q"><b class="n">(${i+1})</b>${x.q}<span class="mark">${isM5?'5':'10'} marks</span>${chips(Y[tab][i].y)}</div>
      ${(x.variants||[]).map((v,k)=>`<div class="var">${v}${chips(Y[tab][i].v[k])}</div>`).join('')}
      <div class="ans"><h4>Textbook answer</h4>${x.a.map(p=>`<p>${p}</p>`).join('')}</div>${showBtn(i)}</div>`).join('')+'</div>';
  }
  app.innerHTML=h+'<div class="foot">ကိုဖြိုးစာပေ — Mr. Phyo Min Zaw (M.C.Sc) · MCK Education Center<br>ဆက်သွယ်ရန် — 092028734 · 32×33 St, 86 St, ချမ်းအေးသာစံမြို့နယ်၊ မန္တလေးမြို့</div>';
  applyFilter();
}
function showBtn(i){ return `<button class="showbtn" data-i="${i}" onclick="toggleOne(${i})">👁 Show Answer</button>`; }
function syncBtn(c){
  const b=c.querySelector('.showbtn'); if(!b) return;
  const open=c.classList.contains('open')||document.getElementById('list').classList.contains('reveal');
  b.classList.toggle('on',open);
  b.textContent=open?'🙈 Hide Answer':'👁 Show Answer';
}
function toggleOne(i){
  const l=document.getElementById('list'), c=document.getElementById('c'+i);
  if(l.classList.contains('reveal')){ // leave "show all" mode, keep others open
    l.classList.remove('reveal');
    document.querySelectorAll('#list .card').forEach(x=>x.classList.add('open'));
    syncAllBtn();
  }
  c.classList.toggle('open');
  document.querySelectorAll('#list .card').forEach(syncBtn);
}
function syncAllBtn(){
  const l=document.getElementById('list'), on=l.classList.contains('reveal'), b=document.getElementById('allBtn');
  b.classList.toggle('on',on);
  b.textContent=on?'🙈 Hide All Answers':'👁 Show All Answers';
}
function toggleAll(){
  const l=document.getElementById('list'); l.classList.toggle('reveal');
  document.querySelectorAll('#list .card').forEach(c=>c.classList.remove('open'));
  document.querySelectorAll('#list .card').forEach(syncBtn);
  syncAllBtn();
}
function pick(i,v){
  sel[tab][i]=v;
  document.querySelectorAll(`.ch[data-i="${i}"]`).forEach(b=>b.classList.toggle('sel', +b.dataset.v===v));
}
function norm(s){return (s||'').toLowerCase().replace(/[\s\-]/g,'');}
function checkAll(){
  const d=DATA[ch][tab]; let right=0;
  d.forEach((x,i)=>{
    const card=document.getElementById('c'+i); let ok=false;
    card.classList.remove('ok','bad');
    if(tab==='tf'){
      const s=sel.tf[i]; ok = s!==undefined && s===x[1];
      document.querySelectorAll(`.ch[data-i="${i}"]`).forEach(b=>{b.classList.remove('right','wrong');
        if(s!==undefined && +b.dataset.v===s) b.classList.add(ok?'right':'wrong');});
    } else if(tab==='mcq'){
      const s=sel.mcq[i]; ok = s!==undefined && s===x[2];
      document.querySelectorAll(`.ch[data-i="${i}"]`).forEach(b=>{b.classList.remove('right','wrong');
        if(s!==undefined && +b.dataset.v===s) b.classList.add(ok?'right':'wrong');});
    } else {
      const inp=document.getElementById('f'+i); ok = norm(inp.value)===norm(x[1]);
      inp.classList.remove('ok','bad'); if(inp.value.trim()) inp.classList.add(ok?'ok':'bad');
    }
    if(ok){right++;card.classList.add('ok');} else card.classList.add('bad');
  });
  const sc=document.getElementById('score'); sc.style.display='block';
  sc.innerHTML=`Score: ${right} / ${d.length} &nbsp;(${Math.round(right*100/d.length)}%)`;
  window.scrollTo({top:0,behavior:'smooth'});
}

const _A=atob('WlFNQ0FC'),_U=atob('VFJZMjAyNg=='),_EXP=new Date(2027,2,20,23,59,59);
function _sv(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function _ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function _check(name,pw){
  if(pw===_A) return 'admin';
  if(pw===_U) return (new Date()<=_EXP)?'user':'expired';
  return 'bad';
}
function _enter(){document.getElementById('login').style.display='none';
  if(!document.getElementById('lo')){const b=document.createElement('button');b.id='lo';b.className='logout';b.textContent='Logout';b.onclick=()=>{_sv('bio_name',null);_sv('bio_pw',null);location.reload()};document.querySelector('header .row').appendChild(b);}
  renderHome();}
function doLogin(){
  const n=document.getElementById('lu').value, p=document.getElementById('lp').value, r=_check(n,p), e=document.getElementById('lerr');
  if(r==='admin'||r==='user'){_sv('bio_name',n.trim());_sv('bio_pw',p);_enter();}
  else if(r==='expired') e.textContent='ဤ password သည် 20-3-2027 အထိသာ သုံးခွင့်ရှိပါသည်။ သက်တမ်းကုန်ဆုံးပါပြီ။';
  else if(r==='bad') e.textContent='Password မှားနေပါသည်။';
  else e.textContent=r;
}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&document.getElementById('login').style.display!=='none')doLogin()});

  if(r==='admin'||r==='user')_enter(); else {if(r==='expired'){_sv('bio_pw',null);document.getElementById('lerr').textContent='သက်တမ်းကုန်ဆုံးပါပြီ (20-3-2027)။';}}})();
