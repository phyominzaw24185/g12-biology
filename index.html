   "The major types of horticulture include olericulture, pomology, viticulture, floriculture, turf management, arboriculture, landscape horticulture, and postharvest physiology. <b>Olericulture</b> is the vegetable growing, dealing with the culture of non-woody (herbaceous) plants for foods. <b>Pomology</b> or <b>Fruticulture</b> is the production of fruits and nuts. <b>Viticulture</b> is the production of grapes (largely intended for winemaking). <b>Floriculture</b> is the growing and marketing of flowers and ornamental plants for floristry. <b>Turf Management</b> is the production and upkeep of turf, artificial and live, for use in recreation. Sports stadiums, civilian landscaping, and leisure are among the largest users of turf management services. <b>Arboriculture</b> is the cultivation and care of individual trees, shrubs, vines, and other perennial woody plants, primarily to maintain individual woody plants and trees for long-term landscape and amenity purposes. <b>Landscape Horticulture</b> is the selection, production and care of plants used in landscape architecture. <b>Postharvest Physiology</b> is the management of harvested horticultural crops to determine the best storage and transportation conditions to optimize shelf life after harvest."

  "a": [

   "<b>Rice</b> (<i>Oryza sativa</i>) production is based on its environment, resulting in rain fed lowland rice, winter rice, deep-water rice, upland rice and irrigated rice. Out of the three distinct seasons, the monsoon season is the main rice production season as rice paddies rely on copious amounts of water. There are two dominant rice production systems: rain fed lowland and irrigated lowland. The traditional method for cultivating rice is flooding the fields while, or after, setting the young seedlings. This simple method requires sound irrigation planning but reduces the growth of less robust weed and pest plants that have no submerged growth state, and deters vermin. While flooding is not mandatory for the cultivation of rice, all other methods of irrigation require higher effort in weed and pest control during growth periods and a different approach for fertilizing the soil."

["Protein","Amino acid","Molecule","Nucleotide"],0],["Vitamin A deficiency can cause ___.",["night blindness","heart disease","blindness","lung disease"],2],["Base pairing leads to DNA being able to replicate and to transfer information to ___.",["rRNA","codon","tRNA","mRNA"],3],["In transcription, ___ is synthesized based on the DNA template of a gene.",["RNA","tRNA","rRNA","mRNA"],3],["___ enzyme unwinds the double helix and unzips the two parental strands.",["Topoisomerase","DNA ligase","Helicase","DNA polymerase"],2],["In transcription, mRNA is synthesized based on the ___ template of a gene.",["RNA","tRNA","rRNA","DNA"],3],["Each ___ carries the specific amino acid at a time at its acceptor stem.",["mRNA","codon","tRNA","RNA"],2],["The two strands of a ___ molecule are not identical but are complementary to each other.",["RNA","sugar","DNA","nucleotide"],2],["One type of antibody made by ___ can deliver radioisotopes to tumour cells.",["rice","corn","soybeans","wheat"],1],["Transcription occurs in the ___ of the cell.",["ribosome","nucleus","cytoplasm","chloroplast"],1],["One type of antibody made by ___ can deliver radioisotopes to tumour cells.",["corn","soybean","rice","wheat"],0],["The central dogma of molecular biology stated that genetic information flows from DNA to ___ to Protein.",["DNA","mRNA","tRNA","RNA"],3],["___ enzyme unwinds parental double helix at replication forks.",["Helicase","Topoisomerase","Primase","DNA ligase"],0],["The second stage of protein synthesis is ___.",["translation","elongation","initiation","transcription"],0],["Transcription occurs in the ___ of the cell.",["cytoplasm","ribosome","nucleus","codon"],2],["Adenine and thymine are joined by two ___ bonds.",["carbon","hydrogen","nitrogen","phosphate"],1],["DNA polymerase replicates the ___ original strands differently.",["two","three","four","many"],0],["In transcription, ___ is synthesized based on the DNA template of a gene.",["mRNA","tRNA","rRNA","codon"],0],["The pyrimidine bases are cytosine and ___.",["adenine","guanine","thymine","purine"],2],["Single-stranded binding ___ act as scaffolding, holding the two strands apart.",["enzymes","DNA","proteins","RNA"],2],["Transcription occurs in the ___ of the cell.",["cytoplasm","ribosome","nucleus","vacuole"],2],["One type of antibody made by ___ can deliver radioisotopes to tumour cells.",["wheat","paddy","barley","corn"],3]],"m5":[{"q":"Describe the method of recombinant DNA with appropriate illustration.","variants":[],"a":["<b>Recombinant DNA</b><br>It is a method of transferring a gene from one organism into the genome of another organism of different species. In order to insert the recombinant gene into a target cell, a vector is needed, which may be plasmid of bacteria, harmless virus, liposome or gene gun.","<b>Figure. Production of recombinant DNA</b><br>Labels: DNA from another species → DNA cut with restriction enzyme to isolate desired gene; plasmid isolated (from <i>Agrobacterium tumefaciens</i>) → plasmid cut open with restriction enzyme; cut plasmid joined to desired gene using ligase."]},{"q":"Explain the three defined stages in the transcription process.","variants":["Briefly explain the three different stages in transcription process.","Classify the three defined stages of the transcription process.","Mention the three stages in the transcription process.","Explain the three stages in the transcription process."],"a":["<b>Transcription</b>","Transcription occurs in the nucleus of the cell. It is the process of copying sequence of DNA to mRNA. There are three defined stages in the transcription process; initiation, elongation, and termination.","<b>Initiation:</b> For each gene, only one strand of the double-stranded DNA molecule is transcribed. This strand is called the antisense strand or template strand. The other strand, which is not transcribed, is called the sense strand or coding strand. It has the same sequence as the product mRNA, with thymine instead of uracil.","<b>Elongation:</b> During the elongation phase, the RNA polymerase complex works its way along the DNA molecule, synthesizing a strand of mRNA that is complementary to the template strand of DNA in 5' to 3' direction.","<b>Termination:</b> When the RNA polymerase complexes reach the termination signal, they detach from the DNA strand. The new mRNA strand is released from the transcription assembly."]},{"q":"Provide labels and a caption to the given diagram. (Do not copy the diagram) — Golden-rice production diagram, labels 1–10.","variants":[],"a":["<b>Label:</b><ol><li>daffodils</li><li>genes</li><li>plasmids</li><li>agrobacteria</li><li>endosperm</li><li>hull</li><li>embryo</li><li>locally important varieties</li><li>provitamin A producing rice embryo</li><li><i>Erwinia</i> bacteria</li></ol>","<b>Caption:</b> Production of golden rice"]},{"q":"Give benefits of genetic engineering of crops and write plants that are also being engineered to produce medicinal products.","variants":[],"a":["<b>Benefits of genetic engineering of crops include</b><ol><li>increased crop yield,</li><li>increased heat and drought tolerance,</li><li>increased resistance to a range of pests and pathogens,</li><li>increased salt tolerance, reduction in harvesting cost and pesticide use, and</li><li>enhanced nutritional value and food quality due to slower spoilage.</li></ol>","Moreover, plants are also being engineered to produce medicinal products. Since the mid-1980s, products such as <b>human growth hormone, clotting factors,</b> and <b>antibodies</b> have been produced in <b>transgenic plants</b>. For instance, one type of antibody made by <b>corn</b> can deliver <b>radioisotopes</b> to <b>tumour cells</b>. Another made by <b>soybeans</b> can be <b>used to treat genital herpes</b>."]},{"q":"Provide and a caption to given diagram and mention about four different nitrogenous bases in DNA. (Do not copy the diagram)","variants":["Provide labels and caption to given diagram and mention the four different nitrogenous bases in DNA. (Do not copy the diagram)"],"a":["<b>Labels:</b><ol><li>Sugar-phosphate backbone</li><li>base pair</li><li>cytosine</li><li>thymine</li><li>guanine</li><li>adenine</li></ol>","<b>Caption:</b> Double helix structure of DNA","Four different nitrogenous bases in DNA that can be categorized into two different forms: <b>purines</b> and <b>pyrimidines</b>. The purine bases are <b>adenine (A)</b> and <b>guanine (G)</b>. They have two fused rings in their chemical structures. The pyrimidine bases are <b>cytosine (C)</b> and <b>thymine (T)</b>. They have a single ring in their chemical structure."]},{"q":"Enumerate the benefits of genetically modified animals.","variants":[],"a":["<b>Benefits of GM animals are</b><ol><li>increased production of a particular product, higher milk yield in cows, greater muscle mass in animals used for meat,</li><li>increased resistance to disease,</li><li>manufacture of human proteins, such as antibodies, blood clotting factors or important proteins for medicinal purposes and</li><li>production of organs for transplantation (xenotransplantation).</li></ol>"]},{"q":"Give the description of transgenic animals focuses on the pharmaceutical products.","variants":[],"a":["Transgenic animals can be used to produce pharmaceutical products such as human proteins by using a recombinant plasmid vector. The vector contains the gene for the growth protein as well as the promoter that directs the expression of the genes in mammary cells. The recombinant DNA is then injected into an oocyte. The oocyte is fertilized and implanted into a host female. The transgenic animals are the offspring produced from that implantation. The milk of female transgenic offspring contains human growth protein."]},{"q":"Give the structure of RNA molecules including the different types and functions.","variants":["Explain the structure of RNA and tabulate some different types of RNA molecules. (Illustration is not necessary)","State the structure of RNA and tabulate some different types of RNA molecules and their function. (Illustration is not necessary)","State the structure of RNA and tabulate some different types of RNA molecules involved in protein synthesis. (Illustration is not necessary.)","State the structure of RNA and tabulate some different types of RNA molecules."],"a":["<b>The Structure of RNA</b><br>Like DNA, RNA is a polymer of nucleotides. RNA contains four nucleotides with the bases adenine (A), uracil (U), cytosine (C), and guanine (G). Unlike DNA, RNA is single-stranded. However, tRNA can fold back on itself, and complementary base pairing within the same molecule stabilizes the looped structure.","There are several types of RNA molecules. Since all are produced from a DNA template, all are synthesized in the nucleus. Only three different RNA molecules that involved in protein synthesis.","<b>Some different types of RNA molecules involved in protein synthesis</b><table class='tb'><tr><th>Types of RNA</th><th>Function</th></tr><tr><td>Messenger RNA (mRNA)</td><td>Acts as the template for translation</td></tr><tr><td>Transfer RNA (tRNA)</td><td>Carries specific amino acid to mRNA at ribosome</td></tr><tr><td>Ribosomal RNA (rRNA)</td><td>Reads the codon on mRNA</td></tr></table>"]},{"q":"Provide labels and a caption to given diagram. (Do not copy the diagram) — Nucleotide excision repair diagram, labels 1–4.","variants":[],"a":["<b>Labels:</b><ol><li>Teams of enzymes detect and repair damaged DNA, such as this thymine dimer (often caused by ultraviolet radiation), which distorts the DNA molecule.</li><li>A nuclease enzyme cuts the damaged DNA strand at two points, and the damaged section is removed.</li><li>Repair synthesis by a DNA polymerase fills in the missing nucleotides.</li><li>DNA ligase seals the free end of the new DNA to the old DNA, making the strand complete.</li></ol>","<b>Caption:</b> Nucleotide excision repair of DNA damage"]},{"q":"Draw labelled diagrams to show the production of recombinant DNA.","variants":[],"a":["See the figure in Questions No.4 (1):","<b>Figure. Production of recombinant DNA</b><br>Labels: DNA from another species → DNA cut with restriction enzyme to isolate desired gene; plasmid isolated (from <i>Agrobacterium tumefaciens</i>) → plasmid cut open with restriction enzyme; cut plasmid joined to desired gene using ligase."]},{"q":"Give labeled diagram of a replication bubble and mention the function of enzymes helicase.","variants":[],"a":["<b>Figure. A replication bubble</b><br>Labels: Overview; Origin of replication; Leading strand (×2); Lagging strand (×2); Primer; Overall directions of replication.","<b>Helicase</b> enzyme unwinds the double helix and unzips the two parental strands by breaking hydrogen bonds."]},{"q":"Define the golden rice and list the benefits of genetic engineering of crops.","variants":["How do you understand golden rice? And list the benefits of genetic engineering of crops."],"a":["The genetically modified rice is called <b>Golden Rice</b>, because it contains a lot of the orange pigment <b>beta-carotene</b> which can be converted into <b>vitamin A</b> when it is eaten.","<b>Benefits of genetic engineering of crops include</b><ol><li>increased crop yield,</li><li>increased heat and drought tolerance,</li><li>increased resistance to a range of pests and pathogens,</li><li>increased salt tolerance, reduction in harvesting cost and pesticide use, and</li><li>enhanced nutritional value and food quality due to slower spoilage.</li></ol>","Moreover, plants are also being engineered to produce medicinal products. Since the mid-1980s, products such as <b>human growth hormone, clotting factors,</b> and <b>antibodies</b> have been produced in <b>transgenic plants</b>. For instance, one type of antibody made by <b>corn</b> can deliver <b>radioisotopes</b> to <b>tumour cells</b>. Another made by <b>soybeans</b> can be <b>used to treat genital herpes</b>."]}],"m10":[{"q":"Discuss the role of DNA in molecular biology as far as you can.","variants":["Discuss the role of DNA.","Write on short account on the role of DNA.","Discuss the role of DNA in molecular biology."],"a":["<b>The Role of DNA</b><br>DNA is the hereditary material responsible for passing genetic information from cell to cell and generation to generation. In total, there are around 3.2 billion base pairs in the DNA of a typical mammalian cell. This vast number means that there are an almost infinite variety of sequences or bases along the length of a DNA molecule. It is this variety that provides the genetic diversity within living organisms.","The DNA molecule is adapted to carry out its functions in a number of ways:<ul><li>It is a very stable structure which normally passes from generation to generation without change. Only rarely does it mutate.</li><li>Its two separate strands are joined only with hydrogen bonds, which allow them to separate during DNA replication and protein synthesis.</li><li>It is an extremely large molecule and therefore carries a large amount of genetic information.</li><li>By having the base pairs within the helical structure of the deoxyribose-phosphate backbone, the genetic information is to some extent protected from being corrupted by outside chemical and physical forces.</li><li>Base pairing leads to DNA being able to replicate and to transfer information to mRNA.</li></ul>","The function of the remarkable molecule, DNA depends on the sequence of base pairs that it possesses. This sequence is important to everything it does and, indeed, to life itself."]},{"q":"Give labeled diagram of the double helix structure of DNA and describe transcription that occurs in the nucleus of the cell.","variants":[],"a":["<b>Figure. Double helix structure of DNA</b>","<b>Labels:</b><ol><li>Sugar-phosphate backbone</li><li>base pair</li><li>cytosine</li><li>thymine</li><li>guanine</li><li>adenine</li></ol>","<b>Caption:</b> Double helix structure of DNA","<b>Transcription</b>","Transcription occurs in the nucleus of the cell. It is the process of copying sequence of DNA to mRNA. There are three defined stages in the transcription process; initiation, elongation, and termination.","<b>Initiation:</b> For each gene, only one strand of the double-stranded DNA molecule is transcribed. This strand is called the antisense strand or template strand. The other strand, which is not transcribed, is called the sense strand or coding strand. It has the same sequence as the product mRNA, with thymine instead of uracil.","<b>Elongation:</b> During the elongation phase, the RNA polymerase complex works its way along the DNA molecule, synthesizing a strand of mRNA that is complementary to the template strand of DNA in 5' to 3' direction.","<b>Termination:</b> When the RNA polymerase complexes reach the termination signal, they detach from the DNA strand. The new mRNA strand is released from the transcription assembly."]},{"q":"Tabulate enzymes that take part in DNA replication and their function. (Illustration is not necessary)","variants":["Tabulate the enzymes that take part in DNA replication and their functions. (Diagram not necessary)"],"a":["<b>Enzymes that take part in DNA replication and their function</b><table class='tb'><tr><th>Protein</th><th>Function</th></tr><tr><td>Helicase</td><td>Unwinds parental double helix at replication forks</td></tr><tr><td>Single-strand binding protein</td><td>Binds to and stabilizes single stranded DNA until it is used as a template</td></tr><tr><td>Topoisomerase</td><td>Relieves overwinding strain ahead of replication forks by breaking, swiveling, and rejoining DNA strands</td></tr><tr><td>Primase</td><td>Synthesizes an RNA primer at 5' end of leading strand and at 5' end of each Okazaki fragment of lagging strand</td></tr><tr><td>DNA pol III</td><td>Using parental DNA as a template, synthesizes new DNA strand by adding nucleotides to an RNA primer or a pre-existing DNA strand</td></tr><tr><td>DNA pol I</td><td>Removes RNA nucleotides of primer from 5' end and replaces them with DNA nucleotides added to 3' end of adjacent fragment</td></tr><tr><td>DNA ligase</td><td>Joins Okazaki fragments of lagging strand; on leading strand, joins 3' end of DNA that replaces primer to rest of leading strand DNA</td></tr></table>"]},{"q":"Discuss the production of transgenic animals.","variants":["Explain the production of genetically modified animals. (Illustration is not necessary)","Discuss the production of transgenic animals. (Illustration is not necessary)"],"a":["<b>Production of Genetically Modified Animals</b><br>The production of transgenic animals is a much more complex process than the production of transgenic plants, and not surprisingly, it is also highly controversial. To produce transgenic animals, a foreign gene is inserted into the genome of an animal oocyte (egg) that is then fertilized. The fertilized egg is implanted in a host female and allowed to develop. The resulting offspring are the transgenic form of the animal. The procedure has been used to <b>produce transgenic fish, pigs, cows, rabbits,</b> and <b>sheep</b>.","Transgenic animals can be used to produce <b>pharmaceutical products</b> such as <b>human proteins</b> by using a <b>recombinant plasmid vector</b>. The vector contains the gene for the growth protein as well as the promoter that directs the expression of the genes in mammary cells. The recombinant DNA is then injected into an oocyte. The oocyte is fertilized and implanted into a host female. The transgenic animals are the offspring produced from that implantation. The milk of female transgenic offspring contains human growth protein."]},{"q":"Explain three important characteristics of the genetic code. (Tabulation is not necessary).","variants":[],"a":["<b>The genetic code has three important characteristics.</b><ol><li>The genetic code is <b>redundant</b>. This means that <b>more than one codon can code for the same amino acid</b>. There are <b>only three codons that do not code for any amino acid</b>. These codons serve as “stop” signals to end protein synthesis.</li><li>The genetic code is <b>continuous</b>. This means that it reads as <b>a series of three-letter codons without spaces, punctuation, or overlap</b>. Therefore, knowing exactly where to start and stop protein synthesis is essential. A shift of one or two nucleotides in either direction can alter the codon groupings and result in an incorrect amino acid sequence.</li><li>The genetic code is <b>nearly universal</b>. Almost all organisms build <b>proteins with the genetic code</b> shown in Table 2.2. (Some rare exceptions are known in some species of protists, for example.) The universality of the genetic code means that a codon in the fruit fly codes for the same amino acid as in a human. This has important implications for gene technology, such as cloning. A gene that is taken from one kind of organism and inserted into another kind of organism will produce the same protein.</li></ol>"]},{"q":"Provide labels and caption to the given diagram and explain the nature of nucleic acid. (Do not copy the diagram)","variants":[],"a":["<b>Labels:</b><ol><li>Teams of enzymes detect and repair damaged DNA, such as this thymine dimer (often caused by ultraviolet radiation), which distorts the DNA molecule.</li><li>A nuclease enzyme cuts the damaged DNA strand at two points, and the damaged section is removed.</li><li>Repair synthesis by a DNA polymerase fills in the missing nucleotides.</li><li>DNA ligase seals the free end of the new DNA to the old DNA, making the strand complete.</li></ol>","<b>Caption:</b> Nucleotide excision repair of DNA damage","<b>Nucleic acids</b> are the main information-carrying molecules of the cell which direct the process of protein synthesis by determining the inherited characteristics of every living thing. The two main classes of nucleic acids are deoxyribonucleic acid (DNA) and ribonucleic acid (RNA). DNA is the master blueprint for life and constitutes the genetic material in all free-living organisms and most viruses. RNA is the genetic material of certain viruses, but it is also found in all living cells, where it plays an important role in certain processes such as the making of proteins."]},{"q":"Explain three phases in the second stage of protein synthesis.","variants":["Describe three phases of translation in protein synthesis. (Illustration is not necessary)"],"a":["<b>Initiation</b><br>In the initiation phase, all the translation components come together. The small ribosomal sub-unit attaches to the mRNA near the <b>start codon (AUG)</b>. The first tRNA that binds to the codon is the initiator tRNA with its <b>UAC anticodon</b>, which joins with the <b>AUG codon</b> of mRNA. Then, a large ribosomal sub-unit joins to form the active ribosome.","<b>Elongation</b><br>The polypeptide becomes longer, adding one amino acid at a time. During elongation, a cycle of four steps is rapidly repeated. First, a tRNA with an attached polypeptide is in the P site, then, peptide bond is formed and tRNA carrying the next amino acid enters the A site. Next, the polypeptide chain is transferred to the amino acid of the tRNA in the A site. This makes the polypeptide chain one amino acid longer than before. Last, the mRNA moves forward by one codon, and the polypeptide-bearing tRNA is now at the ribosome P site. The uncharged tRNA exits. The new codon is at the A site and can receive the next complementary tRNA carrying the next amino acid of the polypeptide.","<b>Termination</b><br>The termination phase begins when a stop codon on the mRNA is reached. The polypeptide and the components of the translation machinery are separated. A protein, called a release factor, cleaves (cuts) the polypeptide from the last tRNA. The polypeptide is released and will eventually fold into its three-dimensional shape as protein, ready to carry out its cellular activities."]},{"q":"Define the term genetic code and explain three important characteristics.","variants":["Define the term genetic code and explain its important characteristic."],"a":["<b>Genetic code</b> is a set of rules for determining how genetic information in the form of a nucleotide sequence is converted to an amino acid sequence of a protein. It defines a code specifying the relationship between a nucleotide codon and an amino acid.","<b>The genetic code has three important characteristics.</b><ol><li>The genetic code is <b>redundant</b>. This means that <b>more than one codon can code for the same amino acid</b>. There are <b>only three codons that do not code for any amino acid</b>. These codons serve as “stop” signals to end protein synthesis.</li><li>The genetic code is <b>continuous</b>. This means that it reads as <b>a series of three-letter codons without spaces, punctuation, or overlap</b>. Therefore, knowing exactly where to start and stop protein synthesis is essential. A shift of one or two nucleotides in either direction can alter the codon groupings and result in an incorrect amino acid sequence.</li><li>The genetic code is <b>nearly universal</b>. Almost all organisms build <b>proteins with the genetic code</b> shown in Table 2.2. (Some rare exceptions are known in some species of protists, for example.) The universality of the genetic code means that a codon in the fruit fly codes for the same amino acid as in a human. This has important implications for gene technology, such as cloning. A gene that is taken from one kind of organism and inserted into another kind of organism will produce the same protein.</li></ol>"]},{"q":"Discuss the initiation and elongation phases of translation process in protein synthesis. (Illustration is not necessary)","variants":[],"a":["See Questions No.5 (7) — Initiation and Elongation:","<b>Initiation</b><br>In the initiation phase, all the translation components come together. The small ribosomal sub-unit attaches to the mRNA near the <b>start codon (AUG)</b>. The first tRNA that binds to the codon is the initiator tRNA with its <b>UAC anticodon</b>, which joins with the <b>AUG codon</b> of mRNA. Then, a large ribosomal sub-unit joins to form the active ribosome.","<b>Elongation</b><br>The polypeptide becomes longer, adding one amino acid at a time. During elongation, a cycle of four steps is rapidly repeated. First, a tRNA with an attached polypeptide is in the P site, then, peptide bond is formed and tRNA carrying the next amino acid enters the A site. Next, the polypeptide chain is transferred to the amino acid of the tRNA in the A site. This makes the polypeptide chain one amino acid longer than before. Last, the mRNA moves forward by one codon, and the polypeptide-bearing tRNA is now at the ribosome P site. The uncharged tRNA exits. The new codon is at the A site and can receive the next complementary tRNA carrying the next amino acid of the polypeptide."]},{"q":"Describe the elongation and termination phases of translation in protein synthesis.","variants":["Explain the elongation and termination phases of translation in protein synthesis. (Illustration is not necessary)"],"a":["See Questions No.5 (7) — Elongation and Termination:","<b>Elongation</b><br>The polypeptide becomes longer, adding one amino acid at a time. During elongation, a cycle of four steps is rapidly repeated. First, a tRNA with an attached polypeptide is in the P site, then, peptide bond is formed and tRNA carrying the next amino acid enters the A site. Next, the polypeptide chain is transferred to the amino acid of the tRNA in the A site. This makes the polypeptide chain one amino acid longer than before. Last, the mRNA moves forward by one codon, and the polypeptide-bearing tRNA is now at the ribosome P site. The uncharged tRNA exits. The new codon is at the A site and can receive the next complementary tRNA carrying the next amino acid of the polypeptide.","<b>Termination</b><br>The termination phase begins when a stop codon on the mRNA is reached. The polypeptide and the components of the translation machinery are separated. A protein, called a release factor, cleaves (cuts) the polypeptide from the last tRNA. The polypeptide is released and will eventually fold into its three-dimensional shape as protein, ready to carry out its cellular activities."]}]};

Swamp forest"],0],["___ is an area set aside by a national government for the preservation of the natural environment.",["Ecological park","National park","Private park","Urban park"],1],["The number of species in a community is known as species ___.",["evenness","richness","frequency","diversity"],1],["All organisms in an ecosystem can affect the ___ conditions around them.",["physical","natural","environmental","biological"],0],["The destruction of the natural environment leads to ___.",["habitat change","habitat fragmentation","habitat diversity","habitat loss"],3],["Pangolins are the only ___ mammal on earth.",["hairy","scaly","feathery","shaggy"],1],["___ occurs where rainfall is usually less than 400 mm a year.",["Mixed deciduous forest","Dry forest","Tropical evergreen forest","Swamp forest"],1],["More than one million pangolins were poached and killed for their ___.",["scales","tail","bones","internal organs"],0],["Habitat destruction has played a key role in ___.",["extinction","extension","existing","extant"],0],["Coral reefs have a very high ___.",["ecosystem","agrodiversity","biodiversity","ecology"],2],["The diverse habitats are home for a wide range of ___.",["kingdom","domain","genus","species"],3],["Coral reefs have a very high ___.",["ecosystem","plants","populations","biodiversity"],3],["Forest ecosystems are a ___ sink and stabilize soils.",["oxygen","nitrogen","carbon","hydrogen"],2],["A variety of human activities threatens the ___ of Myanmar.",["biodiversity","ecosystem","environment","agrobiodiversity"],3],["Genetic diversity is the variety of genes within a ___.",["ecosystem","species","community","population"],1],["Hlawga park is a type of ___.",["National park","Scientific reserve","Wildlife sanctuary","Community forest"],2]],"m5":[{"q":"Briefly explain the ecosystem diversity.","variants":[],"a":["<b>Ecosystem diversity</b><br>An ecosystem is a community of organisms and their physical environment interacting each other's together. The diversity of ecological complexity includes variations in ecological niches, trophic structure, food-webs and nutrient cycling etc. The ecosystems also show variations with respect to physical parameters like moisture, temperature, altitude, precipitation etc. Many ecosystems like deserts, rainforests and mangroves etc., exhibit a vast diversity of life forms residing in their respective ecosystems. Thus, there occurs tremendous diversity within the ecosystem, along these gradients."]},{"q":"Discuss on endangered species designated by IUCN.","variants":[],"a":["<b>Endangered species</b><br>The International Union for Conservation of Nature and Natural Resources (IUCN) publishes the Red Data Book, which includes the list of endangered species of plants and animals. The red data symbolizes the warning signal for those species, which are endangered and if not protected are likely to become extinct in near future.","Myanmar is moderately biodiverse country with many species of trees, shrubs, flowering plants, grasses, insects, fish, amphibians, reptiles, birds, mammals, fungi and micro-organisms. About 250 mammal species, more than 1,000 birds, 370 reptiles and 7,000 plants are recorded in Myanmar, among them 39 species of mammals, 45 of birds, 21 of reptiles and 38 of plants are globally threatened."]},{"q":"Mention the wildlife smuggling or trafficking of pangolin trade.","variants":["State the most trafficked animal in the world.","Write the most trafficked animal in the world."],"a":["The most trafficked animal in the world is the pangolin, accounting for as much as 20% of all illegal wildlife trade. Pangolins are the only scaly mammal on earth. In the last decade, more than one million pangolins were poached and killed for their scales. The <b>pangolin trade</b> is the illegal poaching, trafficking, and sale of pangolins, parts of pangolins, or pangolin-derived products on the black market. The animals are trafficked mainly for their scales, which are believed to be effective in treating a variety of health conditions. Though meat and scales are the primary drivers of the intercontinental pangolin trade, there are also other less common parts and uses."]},{"q":"Enumerate the problems with captive breeding and reintroduction programmes.","variants":["List the problems with captive breeding and reintroduction programmes."],"a":["<b>Problems with captive breeding and reintroduction programmes are:</b><ol><li>not enough space or resources in zoos and parks for all the endangered species</li><li>difficulty in providing the right conditions for breeding, even if scientists know what those conditions are</li><li>continuation of the conditions that pushed the species close to extinction</li><li>animals that have been bred in captivity may have problems adjusting to unsupported life in the wild</li><li>reintroduction programmes can be very expensive and time consuming and they may be fail.</li></ol>"]},{"q":"Why does GE organism a dangerous global experiment with nature and evolution?","variants":[],"a":["The introduction of genetically engineered (GE) organisms into the complex ecosystems of our environment is a dangerous global experiment with nature and evolution. Genetic pollution is undesirable gene flow into wild populations. The term is usually associated with the gene flow from a genetically engineered (GE) organism (or genetically modified organism - GMO) to a non-GE organism. “Genetic pollution” and collateral damage from GE field crops already have begun to wreak environmental havoc. Wind, rain, birds, bees, and insect pollinators have begun carrying genetically altered pollen into adjoining fields, polluting the DNA of crops of organic and non-GE farmers. Once released, it is virtually impossible to recall genetically engineered organisms back to the laboratory or the field."]},{"q":"Give the explanation on human overpopulation.","variants":[],"a":["<b>Human overpopulation</b><br>It is only logical that an increase in the world’s population will cause additional strains on resources. More people increased demand for food, water, housing, energy, healthcare, transportation, and more. And all that consumption contributes to ecological degradation, increased conflicts, and a higher risk of large-scale disasters like pandemics.","An increase in population will inevitably create pressures leading to more deforestation, decreased biodiversity, and spikes in pollution and emissions, which will exacerbate climate change. Ultimately, unless we take action to help minimize further population growth heading into the remainder of this century, many scientists believe the additional stress on the planet will lead to ecological disruption and collapse so severe it threatens the viability of life on Earth, as we know it."]},{"q":"What is wildlife trade? And explain the status of pangolin trade.","variants":[],"a":["<b>Wildlife trade</b> refers to the commerce of products that are derived from non-domesticated animals or plants usually extracted from their natural environment or raised under controlled conditions. It can involve the trade of living or dead individuals, tissues such as skins, bones, feathers, meat, or other products of wild plants and wild animals.","However, the most trafficked animal in the world is the <b>pangolin</b>, accounting for as much as 20% of all illegal wildlife trade. Pangolins are the only scaly mammal on earth. In the last decade, more than one million pangolins were poached and killed for their scales. The pangolin trade is the illegal poaching, trafficking, and sale of pangolins, parts of pangolins, or pangolin-derived products on the black market. The animals are trafficked mainly for their scales, which are believed to be effective in treating a variety of health conditions. Though meat and scales are the primary drivers of the intercontinental pangolin trade, there are also other less common parts and uses."]},{"q":"Define conservation and explain the major reasons to conserve biodiversity.","variants":["Define the term conservation and mention the major reasons to conserve biodiversity."],"a":["<b>Conservation</b> means keeping and protecting a living and changing environment.","<b>Reasons for conservation</b><br>Biodiversity is important and should be conserved for its values and benefits to human health and well-beings. The following are the three major reasons to conserve biodiversity:<ol><li><b>Narrowly Utilitarian</b><br>The useful human products like food, fibres, drugs and medicines are obtained from biodiversity.</li><li><b>Broadly Utilitarian</b><br>Biodiversity provides ecosystem services like providing oxygen, pollinating crops and controlling floods, erosions, etc.</li><li><b>Ethical Utilitarian</b><br>Every living species has an intrinsic value, though it may not have direct economic value and every species has the right to live.</li></ol>"]},{"q":"Differentiate the terms of species diversity and species richness.","variants":["Differentiate the terms species diversity and species richness."],"a":["<b>Species diversity</b><br>Species diversity is defined as the number of species and abundance of each species that lives in a particular location. The number of species in a community is known as <b>species richness</b>. Species diversity not only considers richness, but also includes a measure of the evenness of the abundance of the different species. The more species there are, and the more evenly the numbers of organisms are distributed among the different species and the greater the species diversity. Coral reefs have a very high biodiversity; such an ecosystem offers many different ecological niches, which are exploited by different species. Species diversity is considered important because ecosystems with high species diversity tend to be more stable than ones with limited diversity; they are more able to resist changes."]},{"q":"Write a short account on the nature reserve and wildlife sanctuary.","variants":[],"a":["<b>Nature reserve</b><br>Nature reserve is a protected area of importance for flora, fauna, or features of geological or other special interest, which is reserved and managed for purposes of conservation and to provide special opportunities for study or research (e.g., Popa mountain park, Hkakaborazi national park).","<b>Wildlife sanctuary</b><br>A wildlife sanctuary is an area where animal habitats and their surroundings are protected from any sort of disturbance. The capturing, killing and poaching of animals is strictly prohibited in these regions. They aim at providing a comfortable living to the animals (e.g., Hlawga Park, Chatthin wildlife sanctuary)."]},{"q":"Briefly explain the genetic diversity.","variants":["State about genetic diversity in biology."],"a":["<b>Genetic diversity</b><br>Genetic diversity refers to the variety of genetic information contained in all of the individual plants, animals, fungi and microorganisms. Genetic diversity is the variety of genes within a species. The genetic diversity that exists between varieties of cultivated plants and domesticated animals is obvious. Similar genetic diversity, although not always so obvious, exists in natural populations.","The genetic differences between populations of the same species exist because populations may be adapted slightly differences in different parts of their ranges. There is also genetic diversity within each population. This diversity is important in providing populations with the ability to adapt to changes in biotic and abiotic factors, such as competition with other species, evading new predators, resisting new strains of disease and changes in temperature, salinity, humidity and rainfall."]},{"q":"Explain the impact of wildlife smuggling on the biodiversity of different ecosystems.","variants":[],"a":["Wildlife smuggling directly affects the biodiversity of different ecosystems. Certain animals are in higher demand by smugglers and leading to a visible decline of these species in their native habitats. Wildlife smuggling may also cause the introduction of invasive and harmful species into an ecosystem, which can endanger indigenous wildlife by putting a strain on the environment’s resources through interspecific competition between species. Therefore, wildlife trade is a serious conservation problem, has a negative effect on the viability of many wildlife populations and one of the major threats to the survival of vertebrate species.","The illegal wildlife trade has been linked to the emergence and spread of new infectious diseases in humans, including emergent viruses. Outbreaks of zoonotic diseases including COVID-19, H<sub>5</sub>N<sub>1</sub> avian flu, severe acute respiratory syndrome (SARS), and monkeypox have been traced to live wildlife markets where the potential for zoonotic transmission is greatly increased.","There are certain places in the world where wildlife trade is particularly threatening or where targeted action would be particularly worthwhile. These places are called ‘wildlife trade hotspots’. Therefore, national and international laws are in place for wildlife protection, such as CITES (the Convention on International Trade in Endangered Species of Wild Flora and Fauna), and Conservation of Biodiversity and Protected Areas Law (2018) in Myanmar."]},{"q":"Briefly explain the community forest.","variants":[],"a":["<b>Community forest</b><br>In the early 1990s, the Government of Myanmar introduced <b>Community Forest (CF)</b> as a way to protect endangered forest resources and support the subsistence needs of rural communities. Community forest means all sustainable forest management and utilization activities, in which the local community itself is involved. This expression includes establishing new plantations and managing existing forests, creating employment and income opportunities for subsistence to commercial purposes, generating food, stabilizing ecosystems, and improving the environmental conditions. Community forests are an important tool for biodiversity conservation and sustainable community-driven development."]}],"m10":[{"q":"State the importance of biodiversity.","variants":["Describe importance of biodiversity."],"a":["<b>Importance of biodiversity</b><br>Biodiversity is very important for the well-being of our planet, human health, food security, economy and livelihoods. All organisms in an ecosystem live in interdependence sharing living space, shelter and available food. They can affect the physical conditions around them. Rich biodiversity allows large-scale ecosystems to function and self-regulate. These ecosystems are also interlinked on a large scale across the earth. If biodiversity is reduced in one area, the natural balance may be destroyed elsewhere.","Healthy ecosystem and rich biodiversity will:<ul><li>increase ecosystem productivity; each species in an ecosystem has a specific niche which is a role to play</li><li>support a larger number of plant species and, therefore, a greater variety of crops</li><li>protect fresh water resources</li><li>promote soil formation and protection</li><li>provide nutrient storage and recycling</li><li>aid in breaking down pollutants</li><li>contribute to climate stability</li><li>speed recovery from natural disasters</li><li>provide more food resources</li><li>provide more medicinal resources and pharmaceutical drugs</li></ul>"]},{"q":"List the categories of protected areas in Myanmar and explain any three of them.","variants":["Enumerate the categories of protected areas in Myanmar and explain any three of them."],"a":["<b>In Myanmar, 61 protected areas have been established as following categories:</b><ul><li>Scientific reserve</li><li>National park</li><li>Marine national park</li><li>Nature reserve</li><li>Wildlife sanctuary</li><li>Community forest</li></ul>","<b>Scientific reserve</b><br>Scientific reserve has some similarities to nature reserves. They are held for the protection of their features (including flora and fauna) for “scientific study, research, education, and the benefit of the country” e.g., Tanintharyi Nature Reserve.","<b>National park</b><br>A national park is an area set aside by a national government for the preservation of the natural environment. It is maintained for biodiversity conservation and representativeness and firm management control. No settlement or resource harvesting is allowed. Visitors are permitted e.g., Alaungdawkathapa National Park, Namataung National Park.","<b>Marine national park</b><br>A marine park is a permanent marine reservation for the conservation of species. It constitutes an extension, to the undersea world, of the concept of the terrestrial national park. It is the same as national park but in marine, island and coastal environments e.g., Lampi Island Marine National Park."]},{"q":"Enumerate the examples of some endangered plant species in Myanmar.","variants":["Describe some endangered plant species in Myanmar."],"a":["<b>Some endangered plant species in Myanmar</b><table class='tb'><tr><th>No.</th><th>Scientific name</th><th>Common name</th><th>Myanmar name</th><th>IUCN status</th></tr><tr><td>1</td><td><i>Dipterocarpus alatus</i></td><td>Gurjum tree</td><td>Kanyin</td><td>Endangered</td></tr><tr><td>2</td><td><i>Swietenia macrophylla</i></td><td>Mahogany</td><td>Mahogany</td><td>Endangered</td></tr><tr><td>3</td><td><i>Cephalotaxus mannii</i></td><td>Mann’s plum yew</td><td>Kyauk Htinn shuu</td><td>Endangered</td></tr><tr><td>4</td><td><i>Paphiopedilum wardii</i></td><td>Black Orchid</td><td>Thit-khwa net</td><td>Critically Endangered</td></tr><tr><td>5</td><td><i>Rhododendron arboreum</i></td><td>Rhododendron</td><td>Taung Zalat Ni</td><td>Endangered</td></tr></table>"]},{"q":"Define the term conservation and explain the in situ conservation methods.","variants":["Define the term conservation and state the in situ conservation methods.","How do you understand conservation? Explain in situ conservation methods.","How do you understand the term conservation? Explain in situ conservation methods."],"a":["<b>Conservation</b> means keeping and protecting a living and changing environment. It is an active process involving an enormous range of projects. In order to keep the beauty and diversity of nature reserves. It is important to manage it effectively. Active intervention is required to restore areas and to protect native species, and sustainable benefits for the present as well as future strategies.","<b><i>In situ</i> conservation methods</b><br><i>In situ</i> methods are the ways of conservation of species which take place in the natural habitat of the organism. The best way to conserve any species is to keep it in its natural habitat. Maintaining the natural habitat means that all the “life support systems” are provided.","Nature reserves such as wildlife sanctuary, national park and biosphere reserve help endangered species by maintaining their habitat and genetic diversity, defending the target species from predators and preventing competition from invasive species. Keeping these organisms’ <i>in situ</i> means putting them in the ecosystem where they belong. As a result of this, the target species can continue to adapt to conditions in the reserve without interference from outside influences.","Active management of nature reserves involves; (1) continuous monitoring, (2) maintenance of effective boundaries (3) measures to facilitate the successful completion of life cycles and (4) restocking and reintroducing of once-common species from stocks produced by captive breeding programmes of zoological and botanical gardens."]},{"q":"Write note on wildlife smuggling directly affects the biodiversity of different ecosystems.","variants":["Explain the wildlife smuggling directly affects the biodiversity of different ecosystems."],"a":["Wildlife smuggling directly affects the biodiversity of different ecosystems. Certain animals are in higher demand by smugglers and leading to a visible decline of these species in their native habitats. Wildlife smuggling may also cause the introduction of invasive and harmful species into an ecosystem, which can endanger indigenous wildlife by putting a strain on the environment’s resources through interspecific competition between species. Therefore, wildlife trade is a serious conservation problem, has a negative effect on the viability of many wildlife populations and one of the major threats to the survival of vertebrate species.","The illegal wildlife trade has been linked to the emergence and spread of new infectious diseases in humans, including emergent viruses. Outbreaks of zoonotic diseases including COVID-19, H<sub>5</sub>N<sub>1</sub> avian flu, severe acute respiratory syndrome (SARS), and monkeypox have been traced to live wildlife markets where the potential for zoonotic transmission is greatly increased.","There are certain places in the world where wildlife trade is particularly threatening or where targeted action would be particularly worthwhile. These places are called ‘wildlife trade hotspots’. Therefore, national and international laws are in place for wildlife protection, such as CITES (the Convention on International Trade in Endangered Species of Wild Flora and Fauna), and Conservation of Biodiversity and Protected Areas Law (2018) in Myanmar."]},{"q":"Discuss the role of overexploitation in the threats to biodiversity.","variants":["Write a brief account on overexploitation.","Write an account on overexploitation."],"a":["<b>Overexploitation</b>, also called <b>overharvesting</b>, can lead to the destruction of the resource, as it will be unable to replenish. The term applies to natural resources such as water aquifers, grazing pastures and forests, wild medicinal plants, fish stocks and other wildlife.","<b>Overfishing</b> is the removal of a species of fish (i.e. fishing) from a body of water at a rate greater than that the species can replenish its population naturally. Overfishing can occur in water bodies of any sizes, such as ponds, wetlands, rivers, lakes or oceans, and can result in resource depletion, reduced biological growth rates and low biomass levels.","<b>Overlogging</b> is a form of overexploitation caused by legal or illegal logging activities that lead to unsustainable or irrecoverable deforestation and permanent habitat destruction for forest wildlife.","<b>Overhunting</b> threatens one-third of endangered vertebrates, as well as other groups. Excluding edible fish, the illegal trade in wildlife is valued at $10 billion per year. As of 2016, 301 terrestrial mammals were threatened with extinction due to hunting for bushmeat including primates, even-toed ungulates, bats, diprotodontid marsupials, rodents and carnivores occurring in developing countries. Bushmeat provides increased opportunity for transmission of several zoonotic viruses from animal hosts to humans, such as Ebola virus and HIV."]},{"q":"Give the term meaning of biodiversity and mention the nature of ecosystem diversity and species diversity.","variants":[],"a":["<b>Meaning of biodiversity</b><br>The term ‘biodiversity’ refers to the variety and variability among living organisms and the ecological complexes in which they occur. Thus, biodiversity can be defined as the totality of genes, species and ecosystem of a region. Biodiversity play a significant role in both human life and the natural ecosystem by maintaining the balance of the ecosystem.","<b>Ecosystem diversity</b><br>An ecosystem is a community of organisms and their physical environment interacting each other's together. The diversity of ecological complexity includes variations in ecological niches, trophic structure, food-webs and nutrient cycling etc. The ecosystems also show variations with respect to physical parameters like moisture, temperature, altitude, precipitation etc. Many ecosystems like deserts, rainforests and mangroves etc., exhibit a vast diversity of life forms residing in their respective ecosystems. Thus, there occurs tremendous diversity within the ecosystem, along these gradients.","<b>Species diversity</b><br>Species diversity is defined as the number of species and abundance of each species that lives in a particular location. The number of species in a community is known as <b>species richness</b>. Species diversity not only considers richness, but also includes a measure of the evenness of the abundance of the different species. The more species there are, and the more evenly the numbers of organisms are distributed among the different species and the greater the species diversity. Coral reefs have a very high biodiversity; such an ecosystem offers many different ecological niches, which are exploited by different species. Species diversity is considered important because ecosystems with high species diversity tend to be more stable than ones with limited diversity; they are more able to resist changes."]},{"q":"Discuss protected areas in Myanmar including with the list of categories and then community forest in detail.","variants":[],"a":["<b>Protected Areas in Myanmar</b><br>Protected areas (PAs) are important tools for biodiversity conservation and sustainable development. PAs are safeguard ecosystems and their services, such as water provision, food production, carbon sequestration and climate regulation, thus improving people’s livelihoods. They preserve the integrity of spiritual and cultural values placed by indigenous people on wild areas and offer opportunities of inspiration, study and recreation.","<b>In Myanmar, 61 protected areas have been established as following categories:</b><ul><li>Scientific nature reserve</li><li>National park</li><li>Marine national park</li><li>Nature reserve</li><li>Wildlife sanctuary</li><li>Other nature reserve determined by the Minister</li></ul>","<b>Community forest</b><br>In the early 1990s, the Government of Myanmar introduced <b>Community Forest (CF)</b> as a way to protect endangered forest resources and support the subsistence needs of rural communities. Community forest means all sustainable forest management and utilization activities, in which the local community itself is involved. This expression includes establishing new plantations and managing existing forests, creating employment and income opportunities for subsistence to commercial purposes, generating food, stabilizing ecosystems, and improving the environmental conditions. Community forests are an important tool for biodiversity conservation and sustainable community-driven development."]},{"q":"State the storage of seeds in the seed bank in ex situ conservation methods with suitable word diagram.","variants":["Explain the storage of seeds in the seed bank with word diagram."],"a":["<b>Seed bank</b><br>It has been estimated that 25% of the world’s flowering plant species could disappear within the next 50 years. There are thought to be about 242000 species of flowering plants now, so this would mean 60500 species disappearing in less than one human lifetime. Seed banks have been set up to help conserve rare plant species. Seeds in a seed bank are kept in cold, dark conditions in which the metabolism of the seed slows down so the seed is prevented from germinating.","<b>The storage of seeds</b> is one of the most widespread and valuable <i>ex situ</i> approaches to conservation. Seed banks protect and save plant genetic diversity, which is important for a number of reasons. These saved and viable seeds contain a treasure trove of useful genes that breeders can use for developing improved varieties of our major food crops. For example:<ol><li>Improve resistance to current and emerging plant diseases and insects</li><li>Provide drought or flood tolerance</li><li>Improve yields and nutrition to feed a growing global population</li></ol>","<b>Figure. Some of the steps involved in storing seeds</b><div class='flow'><div>Seeds collected</div><i>↓</i><div>Seeds dried, then stored in a temperature of –14 °C and in dark conditions</div><i>↓</i><div>Seed germination tested at regular intervals</div><i>↓</i><div>Seedlings grown into mature plants</div><i>↺ (back to: Seeds collected)</i></div>"]},{"q":"How do you understand pollution? Explain about genetic pollution.","variants":[],"a":["<b>Pollution</b><br>Pollution (soil, water or air) is a growing threat on both land and in aquatic ecosystems. Pollution is caused by uncontrolled pesticide and herbicide uses, various factory wastes, different kinds of rubbish, human sewage, radioactive materials and industrial wastes.","<b>Genetic pollution</b><br>Genetic pollution indicates the loss of identity of wild plant species as a result of transfer of genes from crop plants, with engineered fitness genes causing special concern. However, significant reproductive barriers exist between most wild species and crop plants. Gene flow is expected to have its greatest effect on weed species that are closely related to crop plants taxonomically, ecologically and in their reproductive biology. The introduction of genetically engineered (GE) organisms into the complex ecosystems of our environment is a dangerous global experiment with nature and evolution. Genetic pollution is undesirable gene flow into wild populations. The term is usually associated with the gene flow from a genetically engineered (GE) organism (or genetically modified organism - GMO) to a non-GE organism. “Genetic pollution” and collateral damage from GE field crops already have begun to wreak environmental havoc. Wind, rain, birds, bees, and insect pollinators have begun carrying genetically altered pollen into adjoining fields, polluting the DNA of crops of organic and non-GE farmers. Once released, it is virtually impossible to recall genetically engineered organisms back to the laboratory or the field."]},{"q":"List the examples of some endangered vertebrate species in Myanmar.","variants":[],"a":["<b>Examples of some endangered vertebrate species in Myanmar</b><table class='tb'><tr><th>No.</th><th>Scientific name</th><th>Common name</th><th>Myanmar name</th><th>IUCN status</th></tr><tr><td>1</td><td><i>Elephas maximus</i></td><td>Asian Elephant</td><td>Sin</td><td>Endangered</td></tr><tr><td>2</td><td><i>Rucervus eldii thamin</i></td><td>Eld’s Deer</td><td>Shwe Thamin</td><td>Endangered</td></tr><tr><td>3</td><td><i>Orcaella brevirostris</i></td><td>Irrawaddy Dolphin</td><td>Linpai</td><td>Endangered</td></tr><tr><td>4</td><td><i>Pavo muticus</i></td><td>Green Peafowl</td><td>Daun</td><td>Endangered</td></tr><tr><td>5</td><td><i>Geochelone platynota</i></td><td>Burmese Star Tortoise</td><td>Kyelait</td><td>Critically Endangered</td></tr></table>"]}]};
